<!DOCTYPE html>
<html lang="en">
<head>
  <title>Squadrats Route Planning</title>
  <style>
      @font-face {
          font-family: DM Sans;
          font-weight: 400;
          src: url("assets/DMSans-Regular-English-Umlaut.woff2") format("woff2");
      }

      @font-face {
          font-family: DM Sans;
          font-weight: 500;
          src: url("assets/DMSans-Medium-English-Umlaut.woff2") format("woff2");
      }

      * {
          font-family: DM Sans, Arial, sans-serif;
          color: white;
      }

      html {
          background: #663399;
          color: white;
          padding: 20px;
      }
      body {
          display: flex;
          flex-flow: column;
          justify-content: space-between;
          align-items: stretch;
          gap: 20px;

          font-size: 16px;
          width: 150px;
      }
      @-moz-document url-prefix() { /* Firefox only */
          body {
              margin-right: 50px;
          }
      }
      .button {
          font-size: 15px;
          font-weight: 500;
          padding: 7px 20px;
          cursor: pointer;
          border-radius: 5px;
      }
      #connect {
          background-color: #00c878;
          border: 0;
          text-decoration: none;
          text-align: center;
      }
      #disconnect {
          background-color: #663399;
          border: 1px solid white;
      }
      #connect:hover, #disconnect:hover {
          filter: brightness(120%);
      }
      .connected-message {
          display: flex;
          gap: 10px;
      }
      p.connected {
          font-size: 11px;
          color: #eee;
          display: block;
          margin: 0;
      }
  </style>
</head>
<body>
  <script src="popup.js"></script>
  <img class="logotype" src="assets/squadrats-white-logotype.svg" alt="Squadrats">
  <a class="button disconnected" id="connect" href="https://dev.squadrats.com/extension/connect" target="_blank">Connect</a>
  <div class="connected">
    <div class="connected-message">
      <img src="assets/check-green.svg" alt="connected">
      <p class="connected">You are connected to your Squadrats account.</p>
    </div>
  </div>
  <button class="button connected" id="disconnect">Disconnect</button>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <title>Squadrats Route Planning</title>
  <style>
      @font-face {
          font-family: DM Sans;
          font-weight: 400;
          src: url("../assets/fonts/DMSans-Regular-English-Umlaut.woff2") format("woff2");
      }
      @font-face {
          font-family: DM Sans;
          font-weight: 500;
          src: url("../assets/fonts/DMSans-Medium-English-Umlaut.woff2") format("woff2");
      }
      * {
          font-family: DM Sans, Arial, sans-serif;
          color: white;
      }
      html {
          background: white;
          color: #663399;
      }
      body {
          border-radius: 10px;
          display: flex;
          flex-flow: column;
          justify-content: space-between;
          align-items: stretch;
          gap: 15px;

          font-size: 16px;
          width: 280px;
          padding: 0;
          margin: 0;
      }
      body.cols3 {
          width: 380px;
      }
      header {
          display: flex;
          gap: 5px;
          align-items: flex-end;
          padding: 20px;
      }
      header.cols3 > * {
          width: 33.3%;
      }
      .button-container {
          display: flex;
          flex-flow: column;
          justify-content: stretch;
          gap: 8px;
          width: 50%;
      }
      .button-container.cols3 {
          width: 32%;
      }
      .button {
          font-size: 13px;
          font-weight: 500;
          padding: 7px 12px;
          cursor: pointer;
          border-radius: 5px;
          align-self: stretch;
          display: flex;
          justify-content: space-around;
          align-items: center;
      }
      .button img {
          height: 16px;
          transform: translateY(-1px);
      }
      #connect {
          background-color: #00c878;
          border: 0;
          text-decoration: none;
          text-align: center;
      }
      #disconnect {
          border: 0;
          background-color: #663399;
      }
      #connect:hover, #disconnect:hover {
          filter: brightness(120%);
      }
      .message {
          display: flex;
          gap: 5px;
          margin-right: 10px;
          width: 50%;
      }
      .message.cols3 {
          margin-right: 50px;
          width: 68%;
      }
      .message.cols3 img {
          margin-right: 4px;
          width: 28px;
      }
      .disconnected {
          color: #fff;
      }
      #logotype {
          height: 20px;
      }
      p {
          font-size: 10px;
          color: #663399;
          margin: 0;
      }
      p.cols3 {
          font-size: 14px;
      }
      #planners {
          margin-top: -20px;
          padding: 65px 20px 20px;
          display: flex;
          flex-flow: column;
          align-items: stretch;
          gap: 5px;
          background-image: url(../assets/random-squares.svg);
          background-color: #663399;
          background-position-y: top;
          background-position-x: -30px;
          background-repeat: repeat-x;
      }

      /* applies to content inserted by popup.js */
        .planners-row {
            display: flex;
            justify-content: space-around;
            gap: 5px;
        }

        .planner-button {
            flex: 1;
            display: flex;
            justify-content: center;
            background-color: #27916a;
            border-radius: 5px;
            cursor: pointer;
        }

        .planner-button:hover {
            filter: brightness(1.25);
        }

        .planner-button img {
            height: 36px;
        }
      /* */
  </style>
</head>
<body>
  <script type="module" src="popup.js"></script>
  <header>
    <div class="connected message">
      <img src="../assets/check-green.svg" alt="connected">
      <p>You are connected to your Squadrats account.</p>
    </div>

    <div class="disconnected message">
      <p>Please connect to your Squadrats account.</p>
    </div>

    <div class="button-container">
      <img id="logotype" src="../assets/squadrats-logotype.svg" alt="Squadrats">
      <a class="button disconnected" id="connect" target="_blank">Connect</a>
      <button class="button connected" id="disconnect">
        <img class=button-icon" src="../assets/shutdown.svg" alt="Disconnect">
        <span>Disconnect</span>
      </button>
    </div>
  </header>

  <div id="planners" class="connected">
    <!-- content inserted by popup.js -->
  </div>
</body>
</html>

<!DOCTYPE html><html><head><meta charset="UTF-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HBO Party</title><link href="../assets/bootstrap.min.css" rel="stylesheet"><style>.netflixext-box {
      display: block;
      width: 332px;
      padding: 15px;
      background: #191919;
      color: #f3f3f3;
    }

    .netflixext-box-header {
      display: block;
      width: 332px;
      background: #3e3d3d;
      color: white;
      padding-top: 10px;
    }

    .start-party-btn {
      background-color: rgb(0, 0, 0);
      background-image: linear-gradient(to bottom right, #dc3545, #620f17);
      padding: 10px;
      width: 100%;
      border: none;
      color: white;
      cursor: pointer;
      margin: 10px 0;
      font-size: 15px;
    }

    .start-party-btn:hover {
      background-image: linear-gradient(to bottom right, #620f17, #dc3545);
    }

    .form-check-input {
      width: 3.2em !important;
      height: 1.5em !important;
    }

    .form-check-input:focus {
      box-shadow: none !important;
    }

    .form-check-input:checked {
      background-color: #14c909 !important;
      border-color: #14c909 !important;
    }

    .link-text {
      width: 60%;
      overflow-x: clip;
    }

    .link-text:hover {
      overflow-x: scroll;
    }

    .link-text::-webkit-scrollbar {
      display: none;
    }

    #copy-text {
      font-size: 13px;
    }</style></head><body class="text-white" style="background:#0a0a0a"><div id="videoFind" class="netflixext-start-party"><div class="netflixext-box"><div class="netflixext-switch d-flex justify-content-between align-items-center"><span>To use the extension, please open a video on one of the supported sites.</span></div><div class="d-grid"><button class="start-party-btn">Learn more</button></div></div></div><script src="../assets/bootstrap.min.js"></script><script src="index.js"></script></body></html>

<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>X-notifier Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div id="loading" role="status">
    <span></span>
  </div>

  <main id="dashboard">
    <aside id="accounts" aria-label="Mail accounts"></aside>
    <section id="content">
      <div id="no-login" class="hidden">
        <a href="https://mail.google.com" target="_blank" rel="noreferrer" title="Gmail"><img src="https://xnotifier.tobwithu.com/xn/gmail.png" alt="Gmail"></a>
        <a href="https://www.icloud.com/mail/" target="_blank" rel="noreferrer" title="iCloud mail"><img src="https://xnotifier.tobwithu.com/xn/icloud.png" alt="iCloud mail"></a>
        <a href="https://mail.live.com" target="_blank" rel="noreferrer" title="Hotmail"><img src="https://xnotifier.tobwithu.com/xn/hotmail.png" alt="Hotmail"></a>
        <a href="https://mail.yahoo.com" target="_blank" rel="noreferrer" title="Yahoo mail"><img src="https://xnotifier.tobwithu.com/xn/yahoo.png" alt="Yahoo mail"></a>
        <a href="https://mail.aol.com" target="_blank" rel="noreferrer" title="AOL mail"><img src="https://xnotifier.tobwithu.com/xn/aol.png" alt="AOL mail"></a>
      </div>

      <div id="message-view" class="hidden">
        <div id="control">
          <label id="selector-box" class="control-box">
            <input id="all-selector" type="checkbox">
          </label>
          <button id="act-spam" class="act-btn hidden" type="button"><span></span></button>
          <button id="act-del" class="act-btn hidden" type="button"><span></span></button>
          <button id="act-read" class="act-btn hidden" type="button"><span></span></button>
        </div>
        <div id="message-scroll">
          <table id="msgs">
            <tbody id="message-list"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="exlib/common.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/dashboard_protocol.js"></script>
  <script src="js/dashboard_port.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>

            <div class="row my-3">
              <div class="col">
                <p class="popup_subY mb-0"></p>
              </div>
              <div class="col">
                <input data-type="subY" type="range" step="0.01" min="0" max="1" value="0.8" class="form-range invert">
              </div>
            </div>

            <div class="row my-3 d-none">
              <div class="col">
                <p class="popup_subY_main mb-0"></p>
              </div>
              <div class="col">
                <input data-type="mainSubY" type="range" step="0.01" min="0" max="1" value="0.8" class="form-range invert">
              </div>
            </div>

            <div class="row my-3 d-none">
              <div class="col">
                <p class="popup_subY_second mb-0"></p>
              </div>
              <div class="col">
                <input data-type="secondSubY" type="range" step="0.01" min="0" max="1" value="0.8" class="form-range invert">
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <p class="popup_spacing mb-0"></p>
              </div>
              <div class="col">
                <input data-type="spacing" type="range" step="0.001" min="0" max="0.015" value="0.005" class="form-range">
              </div>

            <div class="row my-3">
              <div class="col">

              <div class="col">
                <input data-type="maxWidth" type="range" step="0.05" min="0.5" max="0.95" value="0.85" class="form-range">
              </div>
            </div>

            <div class="row align-items-center my-3">
              <div class="col">
                <p class="popup_translation_engine mb-0"></p>
              </div>
              <div class="col">
                <select data-type="translationEngine" class="form-select">
                  <option value="google">Google</option>
                  <option value="azure">Azure</option>
                  <option value="deepl">DeepL</option>
                  <option value="ai">AI</option>
                  <option value="batch">AI (Batch)</option>
                </select>
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <p class="popup_shortcut mb-0"></p>
              </div>
              <div class="col">
                <input data-type="enableShortcuts" class="form-check-input" type="checkbox">
              </div>
            </div>

            <div class="row my-3 align-items-center">
              <div class="col">
                <p class="popup_selectable mb-0"></p>
              </div>
              <div class="col">
                <input data-type="selectable" class="form-check-input" type="checkbox">
              </div>
            </div>

            <div class="row my-3 align-items-center">
              <div class="col">
                <p class="popup_subtitle_list mb-0"></p>
              </div>
              <div class="col">
                <input data-type="subtitleList" class="form-check-input" type="checkbox">
              </div>

            <div class="row my-3 align-items-center">
              <div class="col">
                <p class="popup_dark_mode mb-0"></p>
              </div>
              <div class="col">
                <input data-type="darkMode" class="form-check-input" type="checkbox">
              </div>
            </div>

            <div class="row my-3 border-top pt-1">
              <div class="col">
                <p class="popup_practice_mode fw-bold mb-0 mt-2"></p>
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <div class="btn-group practice-mode-group w-100" role="group" aria-label="Mode">
                  <input type="radio" class="btn-check" name="practiceMode" id="practiceModeWatch" data-type="practiceMode" value="watch" autocomplete="off" checked>
                  <label class="btn btn-outline-secondary btn-sm popup_practice_watch" for="practiceModeWatch"></label>

                  <input type="radio" class="btn-check" name="practiceMode" id="practiceModeDictation" data-type="practiceMode" value="dictation" autocomplete="off">
                  <label class="btn btn-outline-secondary btn-sm popup_practice_dictation" for="practiceModeDictation"></label>

                  <input type="radio" class="btn-check" name="practiceMode" id="practiceModeSpeaking" data-type="practiceMode" value="speaking" autocomplete="off">
                  <label class="btn btn-outline-secondary btn-sm popup_practice_speaking" for="practiceModeSpeaking"></label>

                  <input type="radio" class="btn-check" name="practiceMode" id="practiceModeShadowing" data-type="practiceMode" value="shadowing" autocomplete="off">
                  <label class="btn btn-outline-secondary btn-sm popup_practice_shadowing" for="practiceModeShadowing"></label>

                  <input type="radio" class="btn-check" name="practiceMode" id="practiceModeLearning" data-type="practiceMode" value="learning" autocomplete="off">
                  <label class="btn btn-outline-secondary btn-sm popup_practice_learning" for="practiceModeLearning"></label>
                </div>
              </div>
            </div>

            <div id="practicePanelWatch" class="practice-panel" data-practice-panel="watch"></div>

            <div id="practicePanelDictation" class="practice-panel d-none" data-practice-panel="dictation">

                    <option class="popup_dictation_subtitle_secondary" value="secondary"></option>
                  </select>
                </div>
              </div>

              <div class="row align-items-center my-3">
                <div class="col">
                  <p class="popup_dictation_filtered_words mb-0"></p>
                </div>
                <div class="col">
                  <textarea data-type="dictationFilteredWords" class="form-control" type="text"></textarea>
                </div>
              </div>

              <div class="row my-3">
                <div class="col">
                  <p class="popup_dictation_ignore_bracketed_text mb-0"></p>
                </div>
                <div class="col">
                  <input data-type="dictationIgnoreBracketedText" class="form-check-input" type="checkbox">
                </div>
              </div>

              <div class="row my-3">
                <div class="col">
                  <p class="popup_dictation_typing_sound_volume mb-0"></p>
                </div>
                <div class="col">
                  <input data-type="dictationTypingSoundVolume" type="range" step="0.1" min="0" max="1" value="0.4" class="form-range">
                </div>
              </div>

              <div class="row align-items-center my-3">
                <div class="col">
                  <p class="popup_dictation_input_position mb-0"></p>

                <div class="col">
                  <select data-type="dictationInputPosition" class="form-select">
                    <option class="popup_dictation_input_position_top" value="top"></option>
                    <option class="popup_dictation_input_position_bottom" value="bottom"></option>
                  </select>
                </div>
              </div>
            </div>

            <div id="practicePanelSpeaking" class="practice-panel d-none" data-practice-panel="speaking">

                  <p class="popup_dictation_subtitle mb-0"></p>
                </div>
                <div class="col">
                  <select data-type="dictationSubtitle" class="form-select practice-speaking-subtitle">

                </div>
              </div>

              <div class="row my-3">
                <div class="col">
                  <p class="popup_speaking_playback_volume mb-0"></p>
                </div>
                <div class="col">
                  <input data-type="speakingPlaybackVolume" type="range" step="0.1" min="0" max="1" value="0.8" class="form-range">
                </div>
              </div>
            </div>

            <div id="practicePanelShadowing" class="practice-panel d-none" data-practice-panel="shadowing">
              <div class="row my-3">
                <div class="col">
                  <p class="popup_shadowing_gray_past mb-0"></p>
                </div>
                <div class="col">
                  <input data-type="shadowingGrayPast" class="form-check-input" type="checkbox" checked>
                </div>
              </div>

              <div class="row my-3">
                <div class="col">
                  <p class="popup_shadowing_hide_upcoming mb-0"></p>
                </div>
                <div class="col">
                  <input data-type="shadowingHideUpcoming" class="form-check-input" type="checkbox">
                </div>

              <div class="row my-3">
                <div class="col">
                  <p class="popup_shadowing_auto_remove_line_breaks mb-0"></p>
                </div>
                <div class="col">
                  <input data-type="shadowingAutoRemoveLineBreaks" class="form-check-input" type="checkbox" checked>
                </div>
              </div>
            </div>

                <div class="col">
                  <p class="popup_dictation_subtitle mb-0"></p>
                </div>
                <div class="col">
                  <select data-type="dictationSubtitle" class="form-select practice-learning-subtitle">
                    <option class="popup_dictation_subtitle_main" value="main"></option>
                    <option class="popup_dictation_subtitle_secondary" value="secondary"></option>
                  </select>
                </div>
              </div>

              <div class="row align-items-center my-3">
                <div class="col">
                  <p class="popup_learning_target_language mb-0"></p>
                </div>
                <div class="col">
                  <select id="learningModeLanguages" data-type="learningModeTargetLanguage" class="form-select">
                  </select>
                </div>
              </div>

              <div class="row align-items-center my-3">
                <div class="col">
                  <p class="popup_learning_default_prompt mb-0"></p>
                </div>
                <div class="col">
                  <select data-type="learningModeDefaultPromptId" class="form-select">
                    <option class="web_learning_sample_1_title" value="0"></option>
                    <option class="web_learning_sample_2_title" value="1"></option>
                    <option class="web_learning_sample_3_title" value="2"></option>
                  </select>
                </div>
              </div>

              <div class="row align-items-center my-3">
                <div class="col">
                  <p class="popup_learning_saved_cards mb-0"></p>
                </div>
                <div class="col">
                  <div class="d-grid">
                    <button id="learningModeCardButton" class="popup_learning_link btn btn-link" type="button">
                  </div>
                </div>
              </div>
            </div>

            <div class="row my-3 border-top pt-1">
              <div class="col">
                <p class="popup_style_studio fw-bold mb-0 mt-2"></p>
              </div>
            </div>

            <div class="row my-3">
              <div class="col">
                <button id="styleStudioButton" type="button" class="btn btn-outline-primary btn-sm popup_style_studio_open w-100"></button>

                  <ul id="styleLanguageHintsList" class="popup-style-lang-hints-list list-unstyled mb-0"></ul>

              </div>
            </div>

            <div class="row align-items-center my-3">
              <div class="col">
                <p class="popup_font_stroke_width mb-0"></p>
              </div>

                <input data-type="mainStrokeWidth" type="range" step="0.5" min="0" max="10" value="0" class="form-range">

                <p class="popup_font_shadow_color mb-0"></p>
              </div>
              <div class="col">
                <input data-type="mainShadowColor" type="color" class="form-control form-control-color" value="#000000">
              </div>
            </div>

            <div class="row align-items-center my-3">
              <div class="col">
                <p class="popup_font_background_color mb-0"></p>

                <input data-type="mainFontBackgroundColor" type="color" class="form-control form-control-color" value="#000000">

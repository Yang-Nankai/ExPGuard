<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title></title>
    <link rel="stylesheet" href="resource/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/login.css">
    <script src="resource/bootstrap/bootstrap.bundle.min.js"></script>
  </head>
  <body>
    <div class="container login-page">
      <button id="login" type="button" class="btn patreon-login-btn">
        <img id="patreon-logo" src="image/patreon-logo-white.png" alt="patreon-logo">
        <span id="login-text"></span>
      </button>

      <div class="login-divider">
        <span id="login-or"></span>
      </div>

      <button id="toggle-code" type="button" class="btn btn-outline-secondary login-code-toggle" aria-expanded="false" aria-controls="login-code-panel">
        <span id="login-code-title"></span>
      </button>

      <section id="login-code-panel" class="login-code-panel" hidden>
        <p id="login-code-desc" class="login-section-desc"></p>

        <div class="login-field">
          <label class="login-label" for="email-input" id="login-email-label"></label>
          <input id="email-input" class="form-control" type="email" autocomplete="email">
          <button id="send-code" type="button" class="btn btn-dark login-action" disabled></button>
        </div>

        <div class="login-field">
          <label class="login-label" for="code-input" id="login-code-label"></label>
          <input id="code-input" class="form-control" type="text" autocomplete="one-time-code" spellcheck="false">
          <button id="submit-code" type="button" class="btn btn-dark login-action" disabled></button>
        </div>

        <p id="login-message" class="login-message" role="status"></p>
      </section>
    </div>
  </body>
  <script src="login.min.js"></script>
</html>

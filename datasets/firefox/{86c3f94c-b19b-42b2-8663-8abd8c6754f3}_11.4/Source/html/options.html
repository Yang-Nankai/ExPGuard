<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="../css/options.css">
    <link rel="stylesheet" href="../css/toggle.css">
    <link rel="stylesheet" href="../css/common.css">
	<script src="../js/background.js"></script>
    <script src="../js/options.js"></script>
    <script src="../js/helper/constants.js"></script>
    <script src="../js/helper/dom.js"></script>
    <script src="../js/helper/storage.js"></script>
    <script src="../js/helper/session.js"></script>
    <script src="../js/helper/settings.js"></script>
    <script src="../js/helper/capture.js"></script>
    <script src="../js/helper/rest.js"></script>
    <script src="../js/helper/random_msg.js"></script>
</head>
<body>
<div id="outer">
    <div id="content">
        <img id="img_header" src="../img/cookn_logo.png">
        <button id="btn_login" class="rounded_btn hidden" type="submit">Login</button>
        <p id="email" class="hidden"></p>
        <button id="btn_logout" class="rounded_btn hidden">Logout</button>
        <div id="options" class="hidden">
            <div id="option_capture_to_desktop" class="option_div">
                <div class="toggle_div">
                    <label class="switch">
                        <input id="checkbox_capture_to_desktop" type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>
                <p class="option_lbl">Capture to Desktop</p>
            </div>
            <div id="option_capture_to_cloud" class="option_div">
                <div class="toggle_div">
                    <label class="switch">
                        <input id="checkbox_capture_to_cloud" type="checkbox">
                        <span class="slider"></span>
                    </label>
                </div>
                <p class="option_lbl">Capture to Cloud</p>
            </div>
        </div>
        <img id="spinner" class="hidden" src="../img/spinner.gif">
        <p id="status_msg" class="hidden"></p>
        <table id="footer">
            <tr>
                <td>
                    <img id="img_dvo" class="footer_img" src="../img/cookn_16.png">
                </td>
                <td>
                    <img id="img_facebook" class="footer_img" src="../img/facebook_16.png">
                </td>
                <td>
                    <img id="img_youtube" class="footer_img" src="../img/youtube_16.png">
                </td>
                <td>
                    <img id="img_pinterest" class="footer_img" src="../img/pinterest_16.jpg">
                </td>
                <td>
                    <img id="img_mail" class="footer_img" src="../img/mail_16.png">
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>

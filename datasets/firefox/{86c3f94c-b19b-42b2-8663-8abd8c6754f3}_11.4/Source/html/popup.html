<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cook'n Capture Plugin</title>
    <link rel="stylesheet" href="../css/popup.css">
    <link rel="stylesheet" href="../css/common.css">
	<script src="../js/background.js"></script>
    <script src="../js/popup.js"></script>
    <script src="../js/helper/constants.js"></script>
    <script src="../js/helper/dom.js"></script>
    <script src="../js/helper/storage.js"></script>
    <script src="../js/helper/session.js"></script>
    <script src="../js/helper/settings.js"></script>
    <script src="../js/helper/capture.js"></script>
    <script src="../js/helper/rest.js"></script>

</head>
<body>
    <div id="content">
        <div id="img_settings_div">
            <img id="img_settings" src="../img/settings.png">

        <div id="img_header_div">
            <img id="img_header" src="../img/cookn_logo.png">

        <button id="btn_login" class="rounded_btn hidden" type="submit">Login</button>

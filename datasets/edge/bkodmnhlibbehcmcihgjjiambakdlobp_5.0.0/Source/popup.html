<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search eBay</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="popup.js"></script>
</head>
<body>
<div class="popup-container">
    <!-- Header -->
    <div class="popup-header">
        <h4>
            <img src="images/new-logo-24.png" alt="eBay" width="24" height="24">
            Search eBay
        </h4>
        <span id="ebaySiteBadge" class="site-badge"></span>
    </div>

    <!-- Search Form -->
    <form id="searchForm" class="search-form">
        <label for="search">Search terms</label>
        <div class="search-input-wrapper">
            <input
                type="search"
                id="search"
                name="search"
                placeholder="Enter search terms..."
                autocomplete="off"
                autofocus
            >
            <div id="autocompleteDropdown" class="autocomplete-dropdown hidden"></div>
        </div>

        <div class="options-checkbox">
            <input type="checkbox" id="useOptions" name="useOptions">
            <label for="useOptions">Apply saved <a href="#" id="optionsLink">options</a></label>
        </div>

        <div id="searchModeHint" class="search-mode-hint hidden">
            Searching title &amp; description
        </div>

        <button type="submit" class="btn btn-primary" id="searchBtn">
            <span id="searchBtnText">Search eBay</span>
            <span id="searchSpinner" class="spinner hidden"></span>
        </button>
    </form>

    <!-- Recent Searches -->
    <div class="history-section">
        <div class="history-header">
            <h4>Recent Searches</h4>
            <button id="deleteAllBtn" class="btn btn-secondary">Clear</button>
        </div>

        <div id="emptyState" class="empty-state hidden">
            No recent searches
        </div>

        <ul id="historyList" class="history-list"></ul>
    </div>
</div>
</body>
</html>

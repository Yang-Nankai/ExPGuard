<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search eBay - Options</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="options.js"></script>
</head>
<body>
<div class="options-container">
    <!-- Header -->
    <div class="options-header">
        <img src="images/new-logo-48.png" alt="eBay" width="48" height="48">
        <h2>Search eBay Options</h2>
        <p>Configure your eBay search preferences</p>
    </div>

    <!-- eBay Site Selection -->
    <fieldset>
        <legend>eBay Site</legend>
        <div class="mb-2">
            <label for="ebaysite">Default search site</label>
            <select id="ebaysite">
                <option id="gf-US" value="https://www.ebay.com/sch/i.html?">United States</option>
                <option id="gf-CA" value="https://www.ebay.ca/sch/i.html?">Canada</option>
                <option id="gf-GB" value="https://www.ebay.co.uk/sch/i.html?">United Kingdom</option>
                <option id="gf-AR" value="https://www.mercadolibre.com.ar/sch/i.html?">Argentina</option>
                <option id="gf-AT" value="https://www.ebay.at/sch/i.html?">Austria</option>
                <option id="gf-AU" value="https://www.ebay.com.au/sch/i.html?">Australia</option>
                <option id="gf-BE" value="https://www.ebay.be/sch/i.html?">Belgium</option>
                <option id="gf-BR" value="https://www.mercadolivre.com.br/sch/i.html?">Brazil</option>
                <option id="gf-CN" value="https://www.ebay.com.cn/sch/i.html?">China</option>
                <option id="gf-CZ" value="https://www.ebay.cz/sch/i.html?">Czech Republic</option>
                <option id="gf-DK" value="https://www.ebay.dk/sch/i.html?">Denmark</option>
                <option id="gf-FI" value="https://www.ebay.fi/sch/i.html?">Finland</option>
                <option id="gf-FR" value="https://www.ebay.fr/sch/i.html?">France</option>
                <option id="gf-DE" value="https://www.ebay.de/sch/i.html?">Germany</option>
                <option id="gf-GR" value="https://www.ebay.gr/sch/i.html?">Greece</option>
                <option id="gf-HK" value="https://www.ebay.com.hk/sch/i.html?">Hong Kong</option>
                <option id="gf-HU" value="https://www.ebay.hu/sch/i.html?">Hungary</option>
                <option id="gf-IN" value="https://www.ebay.in/sch/i.html?">India</option>
                <option id="gf-IE" value="https://www.ebay.ie/sch/i.html?">Ireland</option>
                <option id="gf-IT" value="https://www.ebay.it/sch/i.html?">Italy</option>
                <option id="gf-MY" value="https://www.ebay.com.my/sch/i.html?">Malaysia</option>
                <option id="gf-MX" value="https://www.mercadolibre.com.mx/sch/i.html?">Mexico</option>
                <option id="gf-NL" value="https://www.ebay.nl/sch/i.html?">Netherlands</option>
                <option id="gf-NZ" value="https://pages.ebay.com/nz/sch/i.html?">New Zealand</option>
                <option id="gf-NO" value="https://www.ebay.no/sch/i.html?">Norway</option>
                <option id="gf-PH" value="https://www.ebay.ph/sch/i.html?">Philippines</option>
                <option id="gf-PL" value="https://www.ebay.pl/sch/i.html?">Poland</option>
                <option id="gf-PT" value="https://www.ebay.pt/sch/i.html?">Portugal</option>
                <option id="gf-SG" value="https://www.ebay.com.sg/sch/i.html?">Singapore</option>
                <option id="gf-ES" value="https://www.ebay.es/sch/i.html?">Spain</option>
                <option id="gf-SE" value="https://www.tradera.com/sch/i.html?">Sweden</option>
                <option id="gf-CH" value="https://www.ebay.ch/sch/i.html?">Switzerland</option>
                <option id="gf-TW" value="https://www.ruten.com.tw/sch/i.html?">Taiwan</option>
                <option id="gf-TR" value="https://www.gittigidiyor.com/sch/i.html?">Turkey</option>
                <option id="gf-VN" value="https://www.ebay.vn/sch/i.html?">Vietnam</option>
            </select>
        </div>

        <!-- Canada Location Options -->
        <div id="canadaOptions" class="hidden mt-2">
            <label for="canLocation">Limit search to:</label>
            <select id="canLocation">
                <option value="1">Canada Only</option>
                <option value="3">North America</option>
                <option value="2">Worldwide</option>
            </select>
        </div>

        <!-- UK Location Options -->
        <div id="ukOptions" class="hidden mt-2">
            <label for="ukLocation">Limit search to:</label>
            <select id="ukLocation">
                <option value="98">Default</option>
                <option value="1">UK Only</option>
                <option value="3">European Union</option>
                <option value="6">Continental Europe</option>
                <option value="2">Worldwide</option>
            </select>
        </div>
    </fieldset>

    <!-- Search Filters -->
    <fieldset>
        <legend>Search Filters</legend>
        <div class="checkbox-group">
            <label class="checkbox-label" for="titleDesc">
                <input type="checkbox" id="titleDesc" name="titleDesc" value="1">
                <span class="checkbox-text">
                    Search in <strong>Title &amp; Description</strong>
                    <span class="checkbox-hint">(default is title only)</span>
                </span>
            </label>
        </div>
        <div class="checkbox-group">
            <label class="checkbox-label" for="completed">
                <input type="checkbox" id="completed" name="completed" value="1">
                <span class="checkbox-text">
                    Search <strong>Completed</strong> listings only
                </span>
            </label>
        </div>
        <div class="checkbox-group">
            <label class="checkbox-label" for="sold">
                <input type="checkbox" id="sold" name="sold" value="1">
                <span class="checkbox-text">
                    Search <strong>Sold</strong> listings only
                    <span class="checkbox-hint">(includes completed listings)</span>
                </span>
            </label>
        </div>
    </fieldset>

    <!-- Buying Format -->
    <fieldset>
        <legend>Buying Format</legend>
        <div class="checkbox-group">
            <label class="checkbox-label" for="buyingAuction">
                <input type="checkbox" id="buyingAuction" name="buyingAuction" value="1">
                <span class="checkbox-text">
                    <strong>Auction</strong> listings only
                </span>
            </label>
        </div>
        <div class="checkbox-group">
            <label class="checkbox-label" for="buyingBuyNow">
                <input type="checkbox" id="buyingBuyNow" name="buyingBuyNow" value="1">
                <span class="checkbox-text">
                    <strong>Buy It Now</strong> listings only
                </span>
            </label>
        </div>
        <div class="checkbox-group">
            <label class="checkbox-label" for="buyingBestOffer">
                <input type="checkbox" id="buyingBestOffer" name="buyingBestOffer" value="1">
                <span class="checkbox-text">
                    <strong>Accepts Offers</strong>
                    <span class="checkbox-hint">(Best Offer enabled)</span>
                </span>
            </label>
        </div>
    </fieldset>

    <!-- Price & Shipping -->
    <fieldset>
        <legend>Price &amp; Shipping</legend>
        <div class="price-range mb-2">
            <label>Price range</label>
            <div class="price-inputs">
                <input type="number" id="priceMin" placeholder="Min" min="0" step="0.01">
                <span class="price-separator">to</span>
                <input type="number" id="priceMax" placeholder="Max" min="0" step="0.01">
            </div>
        </div>
        <div class="checkbox-group">
            <label class="checkbox-label" for="freeShipping">
                <input type="checkbox" id="freeShipping" name="freeShipping" value="1">
                <span class="checkbox-text">
                    <strong>Free Shipping</strong> only
                </span>
            </label>
        </div>
    </fieldset>

    <!-- Sort Options -->
    <fieldset>
        <legend>Sort Results</legend>
        <div class="mb-2">
            <label for="sorting">Sort by</label>
            <select id="sorting">
                <option value="12">Best Match</option>
                <option value="1">Time: Ending Soonest</option>
                <option value="10">Time: Newly Listed</option>
                <option value="15">Price + Shipping: Lowest First</option>
                <option value="16">Price + Shipping: Highest First</option>
                <option value="2">Price: Lowest First</option>
                <option value="3">Price: Highest First</option>
                <option value="7">Distance: Nearest First</option>
                <option id="endedRecently" value="13" class="hidden">Ended Recently</option>
            </select>
        </div>
    </fieldset>

    <!-- Display Options -->
    <fieldset>
        <legend>Display Options</legend>
        <div class="mb-2">
            <label for="themePref">Theme</label>
            <select id="themePref">
                <option value="auto">Auto (System)</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
        </div>
        <div class="mb-2">
            <label for="displayMode">eBay results view</label>
            <select id="displayMode">
                <option value="0">Default</option>
                <option value="1">List View</option>
                <option value="2">Gallery View</option>
            </select>
        </div>
        <div class="mb-2">
            <label for="wintypePref">Open search results in</label>
            <select id="wintypePref">
                <option value="newtab">New Tab</option>
                <option value="newwin">New Window</option>
                <option value="sametab">Same Tab</option>
            </select>
        </div>
        <div class="mb-2">
            <label for="historyLimit">Search history limit</label>
            <select id="historyLimit">
                <option value="5">5 items</option>
                <option value="10">10 items</option>
                <option value="15">15 items</option>
                <option value="20">20 items</option>
            </select>
        </div>
    </fieldset>

    <!-- Save Button -->
    <button id="saveBtn" class="btn btn-primary">Save Options</button>

    <div id="statusMessage" class="status-message hidden"></div>

    <!-- Secondary Actions -->
    <div class="btn-row">
        <button id="resetBtn" class="btn btn-secondary">Reset</button>
        <button id="exportBtn" class="btn btn-secondary">Export</button>
        <button id="importBtn" class="btn btn-secondary">Import</button>
        <input type="file" id="importFile" accept=".json" class="hidden">
    </div>

    <!-- Footer -->
    <div class="options-footer">
        <p>Some options may not work on all eBay sites.</p>
        <a href="https://paypal.me/derekb/10" class="donation-link" target="_blank" rel="noopener">
            <img src="images/pplogo.png" alt="PayPal">
            <span>Support development</span>
        </a>
        <p>Questions? <a href="mailto:info@bowesmail.com">info@bowesmail.com</a></p>
    </div>
</div>
</body>
</html>

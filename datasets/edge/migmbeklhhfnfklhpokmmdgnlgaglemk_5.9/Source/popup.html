<head>
  <link rel="stylesheet" href="options/css/bootstrap.min.css">

  <link rel="stylesheet" href="css/introjs.min.css">

  <meta charset="UTF-8">
     <style>
		body {
		  min-width:400px;
		  min-height: 500px;
		}
        /*---- fix social icons bottom ----*/
        #appextensionSocial {
            /*clear: both;
            position: fixed;
            bottom: 0;*/
        }

        .center {
            margin: auto;
            width: 100%;
        }
        /*---- highligh Apps ----*/
        .highlightit img {
            filter: progid:DXImageTransform.Microsoft.Alpha(opacity=50);
            -moz-opacity: 0.7;
            opacity: 0.7;
        }

        .highlightit:hover img {
            filter: progid:DXImageTransform.Microsoft.Alpha(opacity=100);
            -moz-opacity: 1;
            opacity: 1;
        }
        /*---- highligh social icons ----*/
        .highlightit2 img {
            filter: progid:DXImageTransform.Microsoft.Alpha(opacity=50);
            -moz-opacity: 0.8;
            opacity: 0.8;
        }

        .highlightit2:hover img {
            filter: progid:DXImageTransform.Microsoft.Alpha(opacity=100);
            -moz-opacity: 1;
            opacity: 1;
        }
        /*---- style on <hr> divisor ----*/
        hr {
            display: block;
            height: 2px;
            border: 0;
            border-top: 2px solid #ccc;
            margin: 0.1em 0;
            padding: 0;
        }
        /*----------------------------*/
		/*Resize the appextensionApps height*/
		#container-3 img {
			width: 32%;
		}

		input[type="search"]::-webkit-search-cancel-button {
			-webkit-appearance: searchfield-cancel-button;
		}
    </style>
</head>

<section style="">

            </li>
            <li>
              <a href="#animals" data-toggle="tab" data-match="Animals & Nature" title="Animals & Nature">

            <li>

            </li>
            <li>

                <span class="round-tabs nine">&#x1F923;</span>
              </a>
            </li>
          </ul>
        </div>

        <div class="tab-content">

          </div>
          <div class="tab-pane fade in active" id="people">

          </div>

          <div class="tab-pane fade" id="food">

    </div>
    <div class="output-holder" style="margin-top: 8px;">
      <div class="" style="display: -webkit-box;">
        <input type="search" placeholder="Click an emoji to insert here" id="emoji-output" class="form-control" style="width: 70%;">
        <div class="" style="width: 30%; text-align: center;">
			<span class="" style="margin-left: 4px;" id="copy">
			  <button class="btn btn-secondary" type="button" style="padding-left: 6px; padding-right: 6px;"><img src="img/topbar/icon_copy.png" title="Copy Emojis"></button>
			</span>
			<span class="" id="newSettings">
			  <button id="newSettingsButton" class="btn btn-secondary" type="button" style="padding-left: 6px; padding-right: 6px;"><img src="img/topbar/icon-settings.png" style="height: 18px;" title="Settings/Premium"></button>
			</span>
			<span class="" id="newWindow">
			  <button class="btn btn-secondary" type="button" style="padding-left: 6px; padding-right: 6px;"><img src="img/topbar/icon_convert.png" title="Open panel in new window"></button>
			</span>

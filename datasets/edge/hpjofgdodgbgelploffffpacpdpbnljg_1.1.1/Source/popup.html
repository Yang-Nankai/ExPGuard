<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>IPTV Player</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5.14v14l11-7-11-7z"/>
          </svg>
        </div>
        <h1 data-i18n="appTitle">IPTV Player</h1>
      </div>
      <div class="top-controls">
        <button id="feedback-button" class="feedback-button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
          </svg>
          <span data-i18n="feedback">Feedback</span>
        </button>
        <button id="rate-button" class="rate-button">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
          </svg>
          <span data-i18n="rateUs">Bewerten Sie uns</span>
        </button>
      </div>
    </div>
    
    <div class="input-section">
      <label for="stream-url" data-i18n="enterStreamUrl">Stream-URL eingeben:</label>
      <input type="text" id="stream-url" placeholder="https://example.com/stream.m3u8" data-i18n-placeholder="streamUrlExample">
    </div>
    
    <button id="play-button" class="play-button">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8 5.14v14l11-7-11-7z"/>
      </svg>
      <span data-i18n="playStream">Stream abspielen</span>
    </button>
    
    <div class="recent-streams">
      <h3 data-i18n="recentStreams">Kürzliche Streams</h3>
      <ul id="stream-history"></ul>
    </div>
    
    <div class="footer">
      <p><span data-i18n="poweredBy">Unterstützt von</span> <a href="#" id="provider-link">IPTVPlayer.Stream</a></p>
      <div class="footer-right">
        <span id="version-number" class="version">v1.1.0</span>
        <select id="language-selector" class="language-selector">
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="pt">Português</option>
          <option value="ko">한국어</option>
          <option value="ja">日本語</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Load libraries -->
  <script src="js/i18n.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/popup.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPTVPlayer.Stream</title>
  <link rel="stylesheet" href="css/video-js.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="elegant-player">
  <div class="elegant-controls-bar">
    <div class="title-section">
      <a href="https://iptvplayer.stream" target="_blank" class="title-link">IPTVPlayer.stream</a>
      <div class="title-controls">
        <select id="language-selector" class="player-language-selector">
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="pt">Português</option>
          <option value="ko">한국어</option>
          <option value="ja">日本語</option>
        </select>
      </div>
    </div>
    
    <div class="buffer-settings">
      <label for="buffer-size" data-i18n="bufferSize">Buffer Size:</label>
      <select id="buffer-size">
        <option value="2">2 MB (Basic)</option>
        <option value="4" selected>4 MB (Standard)</option>
        <option value="8">8 MB (Enhanced)</option>
        <option value="16">16 MB (Maximum)</option>
      </select>
      
      <label for="prebuffer-time" data-i18n="prebuffer">Pre-buffer:</label>
      <select id="prebuffer-time">
        <option value="3">3 seconds</option>
        <option value="5" selected>5 seconds</option>
        <option value="10">10 seconds</option>
        <option value="15">15 seconds</option>
      </select>
      
      <button id="reload-button" data-i18n="reloadStream">Reload Stream</button>
    </div>
  </div>
  
  <div class="player-container">
    <video id="iptv-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" playsinline>
      <p class="vjs-no-js">
        To view this video please enable JavaScript, and consider upgrading to a web browser that
        <a href="https://videojs.com/html5-video-support/" target="_blank">supports HTML5 video</a>
      </p>
    </video>
  </div>

  <!-- Load libraries -->
  <script src="lib/video.min.js"></script>
  <script src="lib/hls.min.js"></script>
  <script src="lib/mpegts.min.js"></script>
  <script src="lib/dash.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/player.js"></script>

<div id="playbackErrorModal" style="display:none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; font-family: 'Roboto', sans-serif; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); opacity: 0; transition: opacity 0.3s ease; will-change: opacity;">
    <div style="background-color: #1e1e24; padding: 40px; border-radius: 12px; text-align: center; max-width: 450px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transform: translateY(20px); transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1); will-change: transform; animation: modalAppear 0.4s forwards cubic-bezier(0.19, 1, 0.22, 1);">
        <svg width="48" height="48" viewBox="0 0 24 24" style="margin-bottom: 15px; fill: none; stroke: #ff4d5e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <h2 style="color: #fff; margin-top: 0; font-size: 24px; font-weight: 500;" data-i18n="playbackError">Playback Error</h2>
        <p style="color: #e0e0e0; line-height: 1.6; margin-bottom: 20px; font-size: 16px;" id="errorMessageP"></p>
        <p style="color: #e0e0e0; line-height: 1.6; font-size: 16px;" data-i18n="corsAlternative">You might be able to play this stream on our website:</p>
        <a href="https://iptvplayer.stream" target="_blank" style="display: inline-block; background-color: #4d7aff; color: white; text-decoration: none; padding: 14px 24px; border-radius: 8px; font-weight: 500; margin: 25px 0; box-shadow: 0 4px 12px rgba(77, 122, 255, 0.25); transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px; font-size: 14px;" data-i18n="playOnWebsite">Play on IPTVPlayer.stream</a>
        <p style="font-size: 14px; color: #b0b0b0; margin-bottom: 0;" data-i18n="tryDifferentStream">You can try a different stream URL in the extension.</p>
    </div>
</div>

<style>
@keyframes modalAppear {
    0% {
        opacity: 0;
        transform: translateY(20px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>
</body>
</html>

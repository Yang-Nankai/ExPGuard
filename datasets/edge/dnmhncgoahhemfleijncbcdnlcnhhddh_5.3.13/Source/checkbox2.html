<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
.toggle-switch {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}

.toggle-switch-checkbox {
  display: none;
}

.toggle-switch-label {
  display: block;
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: background-color 0.3s ease-in-out;
  border-radius: 34px;
}

.toggle-switch-label:before {
  content: "";
  position: absolute;
  width: 26px;
  height: 26px;
  top: 4px;
  left: 4px;
  background-color: white;
  transition: transform 0.3s ease-in-out;
  border-radius: 50%;
}

/* 调整选择器以适应新的HTML结构 */
.toggle-switch-label > .toggle-switch-checkbox:checked + .toggle-switch-label {
  background-color: #2196F3;
}

.toggle-switch-label > .toggle-switch-checkbox:checked + .toggle-switch-label:before {
  transform: translateX(26px);
}
</style>
</head>
<body>
<div class="toggle-switch">
  <label class="toggle-switch-label">
    <input type="checkbox" class="toggle-switch-checkbox toggle">
  </label>
</div>
</body>
<script type="text/javascript">
  document.querySelector(".toggle-switch-checkbox").addEventListener("change", function() {
    // 切换开关状态时的逻辑处理
    if (this.checked) {
      // 开关打开时的逻辑
      console.log("开关已打开");
    } else {
      // 开关关闭时的逻辑
      console.log("开关已关闭");
    }
  });
</script>
</html>

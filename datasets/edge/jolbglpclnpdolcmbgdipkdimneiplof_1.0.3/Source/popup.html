<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <!--link rel="stylesheet" type="text/css" href="libs/layui/css/layui.css" /-->
    <link rel="stylesheet" type="text/css" href="css/popu.css" />
    <script type="application/javascript" src="js/jquery-2.1.1.min.js"></script>
    <script type="application/javascript" src="js/function.js"></script>
	<script type="application/javascript" src="js/layui.js"></script>
    <script type="application/javascript" src="js/popup.js"></script>
</head>
<body>
    <div class="chat_layer_box chat_login">
        <div class="head">
            <div class="logo"><img src="/img/128.png"><div class="sitename"><p><b>qingei.com</b></p><div class="platform-icons"><span class="platform-icon" title="1688">&#xe655;</span><span class="platform-icon" title="Taobao">&#xe648;</span><span class="platform-icon" title="Tmall">&#xe637;</span><span class="platform-icon" title="JD">&#xe61a;</span><span class="platform-icon" title="PDD">&#xe604;</span></div></div></div>
            <div class="homepage"><a href="https://qingei.com" target="_blank" data-i18n="website">进入官网</a></div>
        </div>
        <div id="login_container">
            <div class="layui-form-item">
                <div class="layui-inline">
                  <label class="layui-form-label" data-i18n="account">账号</label>
                  <div class="layui-input-inline">
                    <input type="text" name="username" autocomplete="off" class="layui-input" data-i18n-placeholder="account">
                  </div>
                </div>
              </div>

              <div class="layui-form-item">
                <div class="layui-inline">
                  <label class="layui-form-label" data-i18n="password">密码</label>
                  <div class="layui-input-inline">
                    <input type="password" name="password" autocomplete="off" class="layui-input" data-i18n-placeholder="password">
                  </div>
                </div>
              </div>

              <div class="layui-form-item">
                <div class="layui-input-block">
                  <button type="button" class="layui-btn layui-btn-normal layui-btn-sm" id="Login" data-i18n="login">登录</button>
                  <button type="button" class="layui-btn layui-btn-primary layui-btn-sm" id="Register" data-i18n="register">注册</button>
                </div>
              </div>
        </div>
        
        <div class="userinfo_box">
            <div class="userinfo">
                <div class="memberId">ID : <span></span></div>
                <div class="homepage"><button type="button" class="layui-btn layui-btn-primary layui-btn-sm" id="Backend" data-i18n="member" data-i18n-title="member">>进入后台</button></div>
            </div>
            <div class="autocpsDiv autocpsDiv1">
			    <span data-i18n="floatingball">隐藏浮球:</span>
			    <div class="toggle-switch">
			        <input type="checkbox" name="ratehide" value='0'  id="toggle1" class="ratehide toggle-switch-checkbox" >
			        <label for="toggle1" class="toggle-switch-label"></label>
				</div>
                 <div class="homepage">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<button type="button" class="layui-btn layui-btn-primary layui-btn-sm" id="logout" data-i18n="switch" data-i18n-title="switch">>切换账号</button></div>
				<div class='clear'></div>
		    </div>
        </div>
        <div class="PluginInformation">
            <p><a id="customer_href" href="https://chatbot.weixin.qq.com/webapp/zEkfp6HLzqxQHCdYMFGVNCCoM9L4Xg?robotName=%E4%BA%B2%E7%BB%99%E5%AE%A2%E6%9C%8D-customer%20service" target="_blank" data-i18n-title="customer_service"><img   src="img/kf.png" width="32" height="32"></a>&nbsp;&nbsp;&nbsp;&nbsp; <a href="https://qingei.com/index.php?mod=user&act=tradelist" target="_blank" data-i18n-title="order"><img  src="img/dd.png" width="32" height="32"></a> &nbsp;&nbsp;&nbsp;&nbsp; <a href="https://qingei.com/index.php?mod=user&act=tixian&type=2" target="_blank" data-i18n-title="withdraw"><img src="img/tx.png" width="32" height="32"></a> &nbsp;&nbsp;&nbsp;&nbsp; <a href="https://qingei.com/index.php?mod=user&act=info" target="_blank" data-i18n-title="settings"><img  src="img/sz.png" width="32" height="32"></a> </p>
        </div>
        <div class="checking">
            <div class="progress-3"></div>
            <div class="text" data-i18n="loading">正在获取帐号信息</div>
        </div>
        <div class="banben" style="text-align:center;font-size:10px; padding-top:50px">Version：1.0.3</div>
    </div>
</body>
</html>

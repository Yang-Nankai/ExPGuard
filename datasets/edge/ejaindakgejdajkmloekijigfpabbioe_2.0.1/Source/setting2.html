<style>.xiaoqisetswitchdiv {
    line-height: 40px;
    display: inline-flex;
    align-items: center;
    margin-top: 10px;
    width: 100%;
    gap: 6px;
}
.xiaoqiswitch {
    position: relative;
    display: inline-block;
    width: 60px;
    height: 34px;
}
.xiaoqiswitch input {
    opacity: 0;
    width: 0;
    height: 0;
}
.slider {
    position: absolute;
    cursor: pointer;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: #ccc;
    -webkit-transition: .4s;
    transition: .4s;
}
.slider:before {
    position: absolute;
    content: "";
    height: 26px;
    width: 26px;
    left: 4px;
    bottom: 4px;
    background-color: white;
    -webkit-transition: .4s;
    transition: .4s;
}
input:checked + .slider {
    background-color: #2196F3;
}
input:checked + .slider:before {
    -webkit-transform: translateX(26px);
    -ms-transform: translateX(26px);
    transform: translateX(26px);
}
.slider.round {
    border-radius: 34px;
}
.slider.round:before {
    border-radius: 50%;
}
.custom-select {
    position: relative;
    display: inline-block;
    width: 180px;
    height: 40px;
    border-radius: 34px;
    background-color: #2196F3;
    -webkit-transition: .4s;
    transition: .4s;
    overflow: hidden;
}
.custom-select select {
    width: 100%;
    height: 100%;
    padding: 0 10px;
    border: none;
    background-color:#2196F3;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    cursor: pointer;
    color: white;
	font-size: 20px;
}
.custom-select::after {
    content: '\25BC';
    position: absolute;
    top: 50%;
    right: 10px;
    transform: translateY(-50%);
    color: white;
    pointer-events: none;
}
.custom-select select:focus {
    outline: none;
}</style>

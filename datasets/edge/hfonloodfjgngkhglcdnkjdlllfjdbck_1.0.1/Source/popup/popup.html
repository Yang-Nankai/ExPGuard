<html>

<head>
  <title>Inssave</title>
  <link rel="stylesheet" href="../css/popup.css">
  <link rel="stylesheet" href="../css/bootstrap.min.css">
  <script src="../js/bootstrap.bundle.min.js"></script>
</head>

<body id="ig_saver">
  <header class="ig_saver-header">
    <img src="../img/icon_32.png">
    <p class="ig_saver-logo">inssave</p>
  </header>
  <div class="ig_saver-status-block-wrapper">
    <span>Status</span>
    <div class="ig_saver-active-wrapper">
      <img src="../img/done.svg">
      <span>Active</span>
    </div>
  </div>
  <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
    <li class="nav-item" role="presentation">
      <button class="nav-link active" id="pills-insta-tab" data-bs-toggle="pill" data-bs-target="#pills-insta"
        type="button" role="tab" aria-controls="pills-insta" aria-selected="true">Instagram</button>
    </li>
    <li class="nav-item" role="presentation">
      <button class="nav-link" id="pills-fb-tab" data-bs-toggle="pill" data-bs-target="#pills-fb" type="button"
        role="tab" aria-controls="pills-fb" aria-selected="false">Facebook</button>
    </li>
  </ul>
  <div class="tab-content" id="pills-tabContent">
    <div class="tab-pane fade show active" id="pills-insta" role="tabpanel" aria-labelledby="pills-insta-tab">
      <div class="ig_saver-pills-tabContent-wrapper">
        <div class="ig_saver-download-info-wrapper">
          <p class="ig_saver-download-info">Download videos, photos or stories from Instagram with One Click!</p>
          <div class="ig_saver-download-btn-info">
            <p>Just look for the Download button</p>
            <img src="../img/arrow-down.svg">
          </div>
        </div>
      </div>
      <div class="ig_saver-footer">
        <button class="ig_saver-open-mobile">Open mobile</button>
        <button class="ig_saver-open-desktop">Open desktop</button>
      </div>
    </div>
    <div class="tab-pane fade" id="pills-fb" role="tabpanel" aria-labelledby="pills-fb-tab">
      <div class="ig_saver-pills-tabContent-wrapper">
        <div class="ig_saver-download-info-wrapper">
          <p class="ig_saver-download-info">Download videos, photos or stories from Facebook with One Click!</p>
          <div class="ig_saver-download-btn-info">
            <p>Just look for the Download button</p>
            <img src="../img/arrow-down.svg">
          </div>
        </div>
      </div>
      <button class="ig_saver-open-desktop-facebook">Open desktop</button>
    </div>
  </div>
  <script src="../js/popup.js"></script>
</body>

</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Faircado</title>
    <link href="popup.css" rel="stylesheet" />
  </head>

  <body>
    <h2 id="title" class="title">Oops, this page isn't supported</h2>
    <p id="description">
      No worries! Just click our website recommendation below, and Faircado will work its magic to
      find you the perfect second-hand match

    <div class="badge-wrapper">
      <a id="badge-link-1" class="badge" target="_blank" href="https://amazon.de">
        <span id="badge-text-1">Amazon</span>
        <img src="img/arrow.svg" />
      </a>
      <a
        id="badge-link-2"
        class="badge"
        target="_blank"
        href="https://www.amazon.de/-/en/Matt-Haig/dp/1786892707/ref=tmm_hrd_swatch_0?_encoding=UTF8&qid=1695904998&sr=8-1"
      >
        <span id="badge-text-2">The Midnight Library</span>
        <img src="img/arrow.svg" />
      </a>
      <a
        id="badge-link-3"
        class="badge"
        target="_blank"
        href="https://www.amazon.de/-/en/Harry-Potter-Stein-Weisen-Kinderbuch-Klassiker/dp/3551557411"
      >
        <span id="badge-text-3">Harry Potter</span>
        <img src="img/arrow.svg" />
      </a>
      <a
        id="badge-link-4"
        class="badge"
        target="_blank"
        href="https://www.amazon.de/Promised-Land-Barack-Obama/dp/1524763160/ref=tmm_hrd_swatch_0?_encoding=UTF8&qid=1695905182&sr=8-1"
      >
        <span id="badge-text-4">A Promised Land</span>
        <img src="img/arrow.svg" />
      </a>
    </div>

    <img src="img/bear-earth-x3.png" class="logo" />

  <script src="popup.js"></script>
</html>

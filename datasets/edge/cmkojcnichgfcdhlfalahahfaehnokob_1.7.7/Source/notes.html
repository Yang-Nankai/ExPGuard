<style>
    .notesContainer {
        position: fixed;
        bottom: 0px;
        margin-right: 10px;
        z-index: 999999999;
    }

    .notesHeader {
        background-color: #4169E1;
        border-radius: 5px 5px 0px 0px;
        padding-top: 4px;
        padding-left: 8px;
        padding-bottom: 4px;
        z-index: 999999999;
    }

    #closeNotes {
        font-size: 18px;
        margin-right: 15px;
        float: right;
        cursor: pointer;
    }

    #closeNotes:before {
        content: "\2716";
    }

    .notesContainer textarea {
        color: black;
        background-color: white;
        padding: 15px;
        width: 500px;
        height: 485px; 
        min-height: 300px;
        border-radius: 0px 0px 7px 7px;
        border: 1px solid #ced6e0;
        font-family: 'Times New Roman', Times, serif;
        font-size: 16px;
        box-shadow: none;
        z-index: 999999999;
    }

    .notesContainer textarea:focus {
        outline: none !important;
        border: 1px solid #275EFE;
    }

    .notesHeader {
        border-radius: 7px 7px, 0px 0px;
        font-weight: bold;
        padding-left: 10px;
        color: white;
        font-size: 22px;
    }
    .notesHeader ::before {
        font-weight: bold;
        color: white !important;
        font-size: 22px;
    }
</style>
<div>
    <div class='notesHeader'>
        <span style='padding-left:5px'> Notes</span>
        <div role="button" id='closeNotes'></div>
    </div>
    <textarea id="notes" placeholder='Enter text..'></textarea>
</div>

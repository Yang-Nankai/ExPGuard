<!DOCTYPE html>
<html>
<script src="assets/web_assist/js/waSpeechFrame.js"> </script>

<body>
  <style>
    #waRecorderContainer {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #waStartRecorder,
    #waStopRecorder {
      position: fixed;
      bottom: 25px;
      left: 30px;
      width: 42px;
      height: 42px;
      display: none;
    }

    #waStartRecorder img,
    #waStopRecorder img {
      width: 100%;
      height: 100%;
    }


    #waTimer {
      position: fixed;
      background-color: whitesmoke;
      display: none;
      bottom: 10px;
      vertical-align: bottom;
      text-align: center;
      left: 23px;
    }

    .aWrap .svg-inline--fa {
      color: white !important;
    }

    /* (B) WRAPPER */
    .aWrap {
      position: fixed;
      display: none;
      bottom: 12px;
      left: 100px;
      display: none;
      font-family: Arial, Helvetica, sans-serif;
      align-items: center;     
      width: 310px;
      padding-top: 10px;
      padding-bottom: 10px;
      margin: 5px 0;
      border-radius: 10px;
      background: #444;
      padding-left: 5px;
      padding-top: 5px;
      padding-bottom: 5px;
    }

    .aPlay {
      background-color: #444;
      padding-top: 4px;
      margin-right: 5px;
    }

    .aWrap,
    .aWrap * {
      box-sizing: border-box;
    }

    .aCron {
      color: white;
      width: 138px;
      margin-right: 20px;
    }

    #aPlayIco {
      /* padding-bottom: 2px; */
      /* margin-right: 5px; */
    }

    .aSeek {
      width: 100px;
    }
    #waTimeRange {
    background-color: whitesmoke;
    width: 100px;
    margin-bottom: 2px;
    }

    #waRangeCover {
      display: inline-block;
      width: 0px;
      height: 18px;
      background-color: #ababab;
      vertical-align: bottom;
     
    }
    #playSate {
      height: 36px;
      width:36px;
    }
  </style>

<!DOCTYPE html>
<html data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title data-i18n="how_to_activate_title"></title>
  <script type="module" crossorigin src="/chunks/activate-popup.js"></script>
  <link rel="modulepreload" crossorigin href="/chunks/shared.js">
  <link rel="stylesheet" crossorigin href="/assets/activate-popup.css">
  <link rel="stylesheet" crossorigin href="/assets/all.css">
</head>

<body>
    <div class="card">
        <div class="header">
            <i class="fas fa-power-off"></i>
            <h2>Manual activation</h2>
        </div>
        <p class="subtitle">
            VEXT is a browser extension, not a website extension. You must manually activate it each time you want to use it.
        </p>

        <div class="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <video src="../resources/action.mp4" muted playsinline autoplay></video>
                    <div class="caption">
                        <i class="fas fa-puzzle-piece"></i>
                        <span>Click the icon in your toolbar</span>
                    </div>
                </div>
                <div class="carousel-item">
                    <video src="../resources/context.mp4" muted playsinline autoplay></video>
                    <div class="caption">
                        <i class="fas fa-mouse-pointer"></i>
                        <span>Right-click on the page</span>
                    </div>
                </div>
            </div>
            <div class="carousel-dots">
                <span class="dot active" data-slide-to="0"></span>
                <span class="dot" data-slide-to="1"></span>
            </div>
        </div>

        <button class="primary-button" id="understandButton">
            <span class="button-text" data-i18n="how_to_got_it">Got it!</span>
        </button>
    </div>
</body>

</html>

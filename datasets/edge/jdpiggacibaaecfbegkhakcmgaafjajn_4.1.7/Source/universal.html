<!DOCTYPE html>
<html data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1, shrink-to-fit=no" name="viewport">
    <title>Videochat Extension</title>
  <script type="module" crossorigin src="/chunks/universal.js"></script>
  <link rel="modulepreload" crossorigin href="/chunks/shared.js">
  <link rel="modulepreload" crossorigin href="/chunks/sweetalert2.esm.all.js">
  <link rel="stylesheet" crossorigin href="/assets/universal.css">
</head>

<body>
    <!-- Hard-coded placeholder alert banner (hidden once JS loads) -->
    <div class="placeholder-alpha-banner" id="placeholder-alert-banner">
        <div class="placeholder-alpha-banner-content align-center">
            <div class="placeholder-alpha-banner-text">
                ⚠️ From Zero? Like... from nothing?
            </div>
            <div class="placeholder-alpha-banner-buttons">
                <button class="placeholder-alpha-banner-button secondary">
                    Learn more
                </button>
                <button class="placeholder-alpha-banner-button primary" disabled>
                    OK
                </button>
            </div>
        </div>
    </div>

    <vext-alert-manager id="vextAlertManager"></vext-alert-manager>

    <div class="content-wrapper">
        <div class="header">
            <div class="title">
                <div class="title-row">
                    <span id="extensionHeader">Videochat Extension v0.0.0</span>
                </div>
                <vext-mode-status id="vextModeStatus"></vext-mode-status>
            </div>
        </div>
        <div aria-hidden="true" class="header-divider"></div>

        <lit-start id="litStart"></lit-start>

        <div id="connection-info-container"></div>
    </div>

</body>

</html>

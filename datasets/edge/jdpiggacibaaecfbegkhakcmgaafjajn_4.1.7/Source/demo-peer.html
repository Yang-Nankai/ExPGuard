<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Peer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .peer-container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .peer-logo {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .peer-status {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .peer-status.connecting {
            background: rgba(255, 193, 7, 0.3);
        }

        .peer-status.connected {
            background: rgba(76, 175, 80, 0.3);
        }

        .peer-status.error {
            background: rgba(244, 67, 54, 0.3);
        }

        .video-preview {
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            background: #000;
            margin-bottom: 20px;
        }

        video {
            width: 100%;
            display: block;
        }

        .peer-info {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Hide video element - we only use it for stream source */
        #sourceVideo {
            display: none;
        }

        .debug-info {
            margin-top: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            font-size: 0.85rem;
            text-align: left;
            font-family: 'Courier New', monospace;
        }
    </style>
  <script type="module" crossorigin src="/chunks/demo-peer.js"></script>
  <link rel="modulepreload" crossorigin href="/chunks/shared.js">
</head>
<body>
    <div class="peer-container">
        <div class="peer-logo">📹 Demo Peer</div>
        <div class="peer-status" id="status">Initializing...</div>
        
        <div class="video-preview">
            <video id="previewVideo" autoplay muted loop playsinline></video>
        </div>
        
        <div class="peer-info">
            Ready to stream video via WebRTC
        </div>

        <div class="debug-info" id="debugInfo" style="display: none;"></div>
    </div>

    <!-- Hidden video element for loading source -->
    <video id="sourceVideo" muted loop playsinline></video>

</body>
</html>

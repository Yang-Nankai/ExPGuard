<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Extension Demo - See It In Action</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: #1a1a2e;
        }

        .extension-panel {
            position: relative;
            min-width: 390px;
            max-width: 490px;
            width: 490px;
            height: 100vh;
            border-right: 1px solid #000;
            background: #0f0f1e;
            transition: width 0.1s ease;
            /* box-shadow: 4px 0 20px rgba(102, 126, 234, 0.3); */
        }

        .extension-panel.resizing {
            transition: none;
            user-select: none;
            pointer-events: none;
            border-right: 1px solid #4285f4;
        }

        .resize-handle {
            position: absolute;
            right: -5px;
            top: 0;
            width: 10px;
            height: 100%;
            cursor: col-resize;
            background: transparent;
            z-index: 100;
        }

        .resize-handle:hover {
            background: rgba(102, 126, 234, 0.2);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .demo-section {
            flex: 1;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .demo-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            width: 250px;
            height: 180px;
        }

        .video-loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        
        .video-loading-overlay.show {
            display: flex;
        }
        
        .video-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(66, 133, 244, 0.2);
            border-top-color: #4285f4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .live-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #ff4757;
            color: white;
            padding: 4px 8px;
            border-radius: 3px;
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            z-index: 10;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 250px;
        }

        .controls button {
            padding: 8px 16px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #4285f4;
            color: white;
            font-weight: bold;
            width: 100%;
        }

        .controls button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .controls button:hover:not(:disabled) {
            background: #3367d6;
        }

        #startButton.highlight {
            background: linear-gradient(to bottom, #ff5722, #e64a19);
            box-shadow: 0 0 0 3px rgba(255, 152, 0, 0.8);
            animation: neon-pulse 1s ease-in-out infinite alternate;
        }

        #startButton.next-connection {
            background: linear-gradient(to bottom, #4caf50, #388e3c);
        }

        @keyframes neon-pulse {
            from {
                box-shadow: 0 0 5px #fff, 0 0 10px #ff9800;
            }
            to {
                box-shadow: 0 0 10px #fff, 0 0 20px #ff9800;
            }
        }

        /* Mobile: Stack vertically on small screens */
        @media (max-width: 600px) {
            body {
                flex-direction: column-reverse;
            }

            .extension-panel {
                width: 100% !important;
                min-width: 100% !important;
                max-width: 100% !important;
                height: 60vh;
                border-right: none;
                border-top: 1px solid #ccc;
            }

            .resize-handle {
                display: none;
            }

            .demo-section {
                height: auto;
            }
        }
    </style>
  <script type="module" crossorigin src="/chunks/webrtc-demo.js"></script>
  <link rel="modulepreload" crossorigin href="/chunks/shared.js">
</head>

<body>
    <div class="extension-panel">
        <iframe id="extensionFrame" src="universal.html?domain=webrtc-demo&mode=website&ui=webrtc-demo"></iframe>
        <div class="resize-handle" id="resizeHandle"></div>
    </div>

    <div class="demo-section">
        <div class="demo-content">
            <div class="video-container">
                <div class="live-badge">AI DEMO</div>
                <video autoplay id="remoteVideo" muted playsinline></video>
                
                <!-- Loading spinner overlay -->
                <div class="video-loading-overlay" id="videoLoadingOverlay">
                    <div class="video-spinner"></div>
                </div>
            </div>

            <div class="controls">
                <button class="highlight" id="startButton">Start Demo</button>
                <button disabled id="hangupButton">Stop Demo</button>
                <button id="showHowToButton">How To Activate (!!!)</button>
            </div>
        </div>
    </div>

    <!-- Hidden demo-peer iframe for real WebRTC connection -->
    <iframe id="demoPeerFrame" src="../demo-peer.html" style="display: none;"></iframe>

</body>

</html>

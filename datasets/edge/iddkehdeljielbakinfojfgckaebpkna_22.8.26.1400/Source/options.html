<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,700">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <!--    <link href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css" rel="stylesheet">-->
    <link href="lib/material/material-components-web.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/options.css">
</head>
<body class="mdc-typography">
<div class="container-fluid mt-2">
    <h1>Options Recipe Clipper</h1>


    <!--    ==============================================================================  -->

    <div id="progress-container"
         style="border: 1px black solid; padding: 0.5rem;"
    >
        <p>hello</p>
        <div
                class="mdc-circular-progress"
                style="width:48px;height:48px;" role="progressbar"
                aria-label="Example Progress Bar" aria-valuemin="0" aria-valuemax="1">
            <div class="mdc-circular-progress__determinate-container">
                <svg class="mdc-circular-progress__determinate-circle-graphic" viewBox="0 0 48 48"
                     xmlns="http://www.w3.org/2000/svg">
                    <circle class="mdc-circular-progress__determinate-track" cx="24" cy="24" r="18" stroke-width="4"/>
                    <circle class="mdc-circular-progress__determinate-circle" cx="24" cy="24" r="18"
                            stroke-dasharray="113.097" stroke-dashoffset="113.097" stroke-width="4"/>
                </svg>
            </div>
            <div class="mdc-circular-progress__indeterminate-container">
                <div class="mdc-circular-progress__spinner-layer">
                    <div class="mdc-circular-progress__circle-clipper mdc-circular-progress__circle-left">
                        <svg class="mdc-circular-progress__indeterminate-circle-graphic" viewBox="0 0 48 48"
                             xmlns="http://www.w3.org/2000/svg">
                            <circle cx="24" cy="24" r="18" stroke-dasharray="113.097" stroke-dashoffset="56.549"
                                    stroke-width="4"/>
                        </svg>
                    </div>
                    <div class="mdc-circular-progress__gap-patch">
                        <svg class="mdc-circular-progress__indeterminate-circle-graphic" viewBox="0 0 48 48"
                             xmlns="http://www.w3.org/2000/svg">
                            <circle cx="24" cy="24" r="18" stroke-dasharray="113.097" stroke-dashoffset="56.549"
                                    stroke-width="3.2"/>
                        </svg>
                    </div>
                    <div class="mdc-circular-progress__circle-clipper mdc-circular-progress__circle-right">
                        <svg class="mdc-circular-progress__indeterminate-circle-graphic" viewBox="0 0 48 48"
                             xmlns="http://www.w3.org/2000/svg">
                            <circle cx="24" cy="24" r="18" stroke-dasharray="113.097" stroke-dashoffset="56.549"
                                    stroke-width="4"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!--    ==============================================================================  -->
    <div class="mdc-card"
         style="--mdc-layout-grid-margin-desktop:0.5em; --mdc-layout-grid-gutter-desktop:0.5em;"
    >
        <div class="mdc-card__primary-action" tabindex="0">
            <div class="card-header">
                <div class="card-title">
                    <h2>Debug: Stored values</h2>
                </div>
            </div>
        </div>

        <div>
            <span><b>user id</b></span>
            <span id="stored-userid-id"></span>
        </div>
        <div>
            <span><b>token</b></span>
            <span id="stored-token-id"></span>
        </div>
        <div>
            <span><b>import server URL </b></span>
            <span id="stored-extract-url-id"></span>
        </div>

        <div>
            <h4>Folders</h4>
            <ol id="stored-folders-id">
            </ol>
        </div>

    </div>
    <!--    ==============================================================================  -->
    <p id="versionNumber"></p>

</div>
<script src="lib/material/material-components-web.min.js"></script>
<script src="options.js"></script>
</body>
</html>

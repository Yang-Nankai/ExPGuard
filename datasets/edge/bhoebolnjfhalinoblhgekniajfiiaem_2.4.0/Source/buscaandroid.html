<!DOCTYPE HTML> <!-- Solo para Android -->
<html>
	<head>
	<meta http-equiv="content-type" content="text/html; charset=UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Android -->
	<title>Buscar palabra en DLE</title>
	<script src="content.js" charset="UTF-8"></script>
	<script src="buscapalabra.js" charset="UTF-8"></script>
	<style>
	body {
		width: 95%;
		max-width: 720px;
		margin: 4px auto;
	}
	.cRAEcajaboton {
		height: calc(100vh - 9em); /* Dejar esto por si no funciona getBoundingClientRect en alguna versión de Firefox*/
		width: 101.8%;
		margin-top:4px;
		margin-left:-1.4%;
	}
	iframe {
		height: 100%;
		width: 100%;
		border-radius: 6px;
		-webkit-border-radius: 6px;
		border-radius: 6px;
	}
	#dcontenedor {
		-moz-user-select: none;
		position: relative;
		display: flex;
	    justify-content: space-around;
	    flex-wrap: wrap-reverse;
		width:100%;
		left: 50%; transform: translateX(-50%);
		max-width: 10em
		-webkit-border-radius: 10px;
		border-radius: 10px;
		margin-left: 0px;
		padding: 8px;
		background:rgb(255, 230, 204);
	}
	#dbusqueda {
		/*margin:8px;*/
		padding: 0px 6px 6px 6px;
		border-radius: 10px;
		background: rgb(255, 169, 77);
	}
	fieldset {
		padding: 4px 6px 6px 6px;
		border-radius: 5px;
	}
	legend {
		font-size: 0.9em;
		font-family: 'Gill Sans', sans-serif;
	}
	#dbotones {
		display: flex;
	    justify-content: space-between;
		margin-bottom: 6px;
		border-radius: 10px;
		/*background: white;*/
	}
	#idcuadrobuscar {
		width: 10em;
		font-size: 1.3em;
	}
	#bbuscar {
		font-size: 1.4em;
		width: 1.6em;
		border-radius: 10px;
		background-image: url('img/lupam32.png');
		background-position: center;
		background-repeat: no-repeat;
		background-size: auto 100%;
	}
	.aconimagen{
		height: auto;
		cursor: pointer;
		padding: 2px;
		text-decoration: none
	}
	.aconimagen div{
		display: flex;
	    justify-content: space-around;
	    flex-wrap: wrap-reverse;
		background: rgb(255, 169, 77);
		border-radius: 5px;
		border-style:solid;
		border-color: rgb(190, 190, 190);;
		border-width:1px 4px 4px 1px;
	}
	.aconimagen img{
		height: 20px;
		padding: 2px;
	}
	.aconimagen span{
		padding: 2px 5px;
		font-size: 1em;
		font-family: 'Gill Sans', sans-serif;
		color: black;
	}
	</style>
	</head>	
	<body>
		<div  id="dcontenedor">
			<div id="dbusqueda">
				<fieldset id="fbusqueda" >
					<legend> Buscar definición en el DLE </legend>
					<input id="idcuadrobuscar" type="search" name="w" value="" placeholder="palabra" autofocus="autofocus" autocomplete="off" autocapitalize="off">
					<button id="bbuscar" title='Buscar en DLE'>&nbsp;</button>
				</fieldset>
			</div>
			<div id="dbotones">
				<a class="aconimagen" id="iopciones" href=configurar.html target="_self" rel="noopener noreferrer"><div><img src='img/ruedagris.png' alt='Configurar opciones' title='Ir a configurar opciones'><span>Configurar</span></div></a>
				<a class="aconimagen" id="iayuda" href=ayudaandroid.html target="_self" rel="noopener noreferrer"><div><img src='img/interrogantev.png' alt='Ayuda' title='Ayuda'><span>Ayuda</span></div></a>
				<a class="aconimagen" id="adle" target="_self" rel="noopener noreferrer" tabindex="0">
					<div><img id="idle" src='img/dle32.png' alt='Diccionario RAE' title='Visitar web «Diccionario de la lengua española»' tabindex="-1"><span>Web&nbsp;oficial</span></div></a>
			</div>
		</div>
	</body>
</html>

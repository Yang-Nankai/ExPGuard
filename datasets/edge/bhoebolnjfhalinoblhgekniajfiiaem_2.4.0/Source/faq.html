<style>
	body {
		background: #fff5e6;
		font-size: 1.2em;
	}

	#div_contenedor {
		width: 50%;
		position: relative;
		left:50%; transform: translateX(-50%);
		min-width: 280px;
		max-width: 630px;
	}
	@media (max-width: 900px) {
	    #div_contenedor {
	        width: 60%;
	    }
	}
	@media (max-width: 600px) {
	    #div_contenedor {
	        width: 80%;
	    }
	}

	#aopciones > span:before {
		content: "Configurar las opciones";
	}
	@media (max-width: 768px) {
		#aopciones > span:before {
			content: "Opciones";
		}
	}

	@media (max-width: 768px) {
		ul {
			font-size: 0.9em;
		}
	}

	li {
		font-size: 1.2rem;
		margin-top: 1.1em;
		margin-bottom: 0.5em;
		padding:10px;
		-webkit-border-radius: 5px 10px;
		border-radius: 5px 10px;
		background: #ffe696;
	}
</style>

	</p>

	<div style="font-size: 1.3em; padding:17px; -webkit-border-radius: 5px 10px; border-radius: 5px 10px; background: #ffa94d;">Dudas frecuentes</div>

<html>
<head>
	<!-- Firebase Auth (bundled locally for MV3 CSP - no remote scripts) -->
	<script src="scripts/firebase-app-compat.js"></script>
	<script src="scripts/firebase-config.js"></script>
	<script src="scripts/firebase-auth-compat.js"></script>
	<script src="scripts/firebase-auth.js"></script>
	<script src="scripts/sbx.js"></script>
	<script src="scripts/sbx-settings.js"></script>
	<script src="scripts/sbx-api.js"></script>
	<script src="scripts/popup.js"></script>
	<link href="styles/popup.css" media="all" rel="stylesheet" type="text/css" />
</head>

<body class="login-mode" style="width: 480px;">

	<div class="login" id="login">

		<form>
			<table cellpadding="5" cellspacing="0">
				<tbody>
				<tr>
					<td colspan="2" align="center">
						<div class="a-padding">
							<img src="images/logo.png" /> <br/>
							Safe Browser
						</div>
					</td>
				</tr>
				<tr>
					<td align="right">Email: </td>
					<td><input type="email" id="email" /></td>
				</tr>
				<tr>
					<td align="right">Password: </td>
					<td><input type="password" id="password" /></td>
				</tr>
				<tr>
					<td colspan="2" align="center" class="login-buttons">
						<a href="#" class="btn btn-primary" id="signIn">Authorize</a>
						<a href="https://app.kiddoware.com/" target="_blank">Remind password</a>
					</td>
				</tr>
				<tr>
					<td colspan="2" align="center" style="padding-top: 8px;">
						<span class="text-muted" style="font-size: 12px; color: #666;">or</span>
					</td>
				</tr>
				<tr>
					<td colspan="2" align="center">
						<a href="#" class="btn btn-google" id="signInGoogle" title="Sign in with Google">
							<svg width="18" height="18" viewBox="0 0 18 18" style="vertical-align: middle; margin-right: 6px;"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.3z"/></svg>
							Sign in with Google
						</a>
					</td>
				</tr>
				</tbody>
			</table>
		</form>

		<div class="alert" id="default-alert" data-content="unregistered_note"></div>
		<div class="alert alert-danger hide" id="failed-auth-alert">
			<span class="error-msg" id="auth-error-msg"></span><br/>
			<span data-content="login_warning"></span>
		</div>
		<div class="alert hide" id="google-auth-hint" style="background:#e3f2fd;color:#0d47a1;font-size:13px;line-height:1.4;"></div>
		<div class="copyright">&copy; Kiddoware 2024</div>
	</div>

	<div class="settings" id="settings">

    <a href="https://chromewebstore.google.com/detail/kids-safe-search-engine/fjmiccpdnbjkegppnjkamgbbjpbmgabn?hl=en"
       target="_blank"
	   data-content="kids_safe_searche_engine"
       style="display: inline-block; background-color: #4CAF50; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-size: 16px;">
    </a>
		<h2 style="margin: 0; padding: 0 0 20px 0; text-align: center;" data-content="Safe_Browser_filtering_enabled"></h2>
		<table cellpadding="5" cellspacing="0">
			<tbody>
				<tr>
					<td align="right"><span data-content="Driven_by_account"></span>: </td>
					<td><a href="https://app.kiddoware.com/"  id="info-deviceConnected" target="_blank"></a></td>
				</tr>
				<tr>
					<td align="right"><span data-content="License_expires_on"></span>: </td>
					<td id="info-endDate"></td>
				</tr>
				<tr>
					<td align="right"><span data-content="Display_notification"></span>: </td>
					<td><input id="settings-notifyOnBlock" type="checkbox" value="1" /> <span data-content="Display_notification_description" style="font-size: 70%;"></span></td>
				</tr>
				<tr>
					<td align="center" colspan="2"><a href="https://app.kiddoware.com/" target="_blank" data-content="Safe_Browser_Settings" style="font-size: 120%;"></a></td>
				</tr>
				<tr>
					<td colspan="2" align="left" style="font-size: 12px;">
						 <span data-content="detach_guide"> </span>
						 <a href="https://app.kiddoware.com/" target="_blank"><img src="images/xmpl.png" class="detachXmpl" /></a>
					</td>
				</tr>
				<tr>
					<td align="right"><span data-content="Account_id"></span>: </td>
					<td id="info-fid"></td>
				</tr>
				<tr>
					<td align="right"><span data-content="Device_id"></span>: </td>
					<td id="info-deviceID"></td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Controller</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h3 id="current-title">Now Playing: </h3>
    <p id="current-website">Website: </p>
    <div class="controls">
      <button id="play">Play</button>
      <button id="pause">Pause</button>
      <button id="autoplay">Enable Autoplay</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>

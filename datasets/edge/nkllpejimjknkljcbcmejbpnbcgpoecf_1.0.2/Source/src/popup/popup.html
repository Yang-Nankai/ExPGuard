<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>SyncFun</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      overflow-y: hidden;
      box-sizing: border-box;
    }
    html, body {
      width: 360px;
      height: 500px;
      overflow-y: hidden;
      overflow: hidden;
    }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1f2937 100%);
      overflow: hidden;
    }
    .embed-iframe {
      width: 100%;
      height: 500px;
      border: none;
      display: block;
      overflow-y: hidden;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <iframe 
    class="embed-iframe"
    src="http://bobobili.cn/#/embed"
    frameborder="0"
    scrolling="no"
    allowfullscreen
  ></iframe>
</body>
</html>

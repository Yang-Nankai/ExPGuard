    <style type="text/css">
        button {

        h2,h3{

        }

        /* From uiverse.io by @adamgiebl */
        /* Customize the label (the container) */
        .container {
         display: block;
         position: relative;
         padding-left: 35px;
         margin-bottom: 12px;
         cursor: pointer;
         font-size: 14px;
         user-select: none;
         width:80px;
         display:inline-flex;
        }
        
        /* Hide the browser's default checkbox */
        .container input {
          position: absolute;
          opacity: 0;
          cursor: pointer;
          height: 0;
          width: 0;
        }
        
        /* Create a custom checkbox */
        .checkmark {
          position: absolute;
          top: 0;
          left: 0;
          height: 18px;
          width: 18px;
          background-color: #ccc;
        }
        
        /* When the checkbox is checked, add a blue background */
        .container input:checked ~ .checkmark {
          background-color: #4E6EF2;
        }
        
        /* Create the checkmark/indicator (hidden when not checked) */
        .checkmark:after {
          content: "";
          position: absolute;
          display: none;
        }
        
        /* Show the checkmark when checked */
        .container input:checked ~ .checkmark:after {
          display: block;
        }
        
        /* Style the checkmark/indicator */
        .container .checkmark:after {
          left: 5px;
          top: 1px;
          width: 5px;
          height: 10px;
          border: solid white;
          border-width: 0 3px 3px 0;
          transform: rotate(45deg);
        }
           #logo_review{

           }

           /* From uiverse.io by @Mike11jr */
           .btn {
            letter-spacing:3px;
            width: 130px;
            height: 35px;
            font-size: 1.1em;
            cursor: pointer;
            background-color: #636363; 
            color: white;
            border: none;
            border-radius: 5px;
            transition: all .4s;
           }
           /*
           .btn:hover {
            border-radius: 5px;
            transform: translateY(-10px);
            box-shadow: 0 7px 0 -2px #f85959,
             0 15px 0 -4px #39a2db,
             0 16px 10px -3px #39a2db;
           }
           */
           
           .btn:active {
            transition: all 0.2s;
            transform: translateY(-5px);
            box-shadow: 0 2px 0 -2px #f85959,
             0 8px 0 -4px #39a2db,
           }
           
           /* From uiverse.io by @aasisodiya */
           /* The switch - the box around the slider */
           .switch {
            font-size: 1rem;
            position: relative;
            display: inline-block;
            width: 4em;
            height: 2em;
            min-width: 118px;
           }
           
           /* Hide default HTML checkbox */
           .switch input {
            opacity: 0;
            width: 0;
            height: 0;
           }
           
           /* The slider */
           .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #eee;
            transition: 0.4s;
            border-radius: 0.5em;
            box-shadow: 0 0.2em #dfd9d9;
           }
           
           .slider:before {
            position: absolute;
            content: "";
            height: 1.5em;
            width: 1.4em;
            border-radius: 0.3em;
            left: 0.3em;
            bottom: 0.7em;
            background-color: lightsalmon;
            transition: 0.4s;
            box-shadow: 0 0.4em #bcb4b4;
           }
           
           .slider:hover::before {
            box-shadow: 0 0.2em #bcb4b4;
            bottom: 0.5em;
           }
           
           input:checked+.slider:before {
            transform: translateX(5.5em);
            background: #4E6EF2;;
           }
</style>

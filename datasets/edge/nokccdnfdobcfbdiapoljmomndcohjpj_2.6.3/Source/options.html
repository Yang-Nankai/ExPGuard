<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>titleOption</title>
  <link rel="stylesheet" type="text/css" href="css/public.css" media="all" />
  <link rel="stylesheet" type="text/css" href="css/options.css" media="all" />
  <script src="lib/jquery.min.js"></script>
  <script src="js/init.js"></script>
  <script src="js/function.js"></script>
</head>

<body>
  <!-- 添加导航栏 -->
  <nav class="sidebar">
    <ul>
      <li><a href="#anchorSuffix" data-i18n="suffix"></a></li>
      <li><a href="#anchorType" data-i18n="type"></a></li>
      <li><a href="#anchorRegexMatch" data-i18n="regexMatch"></a></li>
      <li><a href="#anchorScriptSettings" data-i18n="Script"></a></li>
      <li><a href="#anchorBlockUrl" data-i18n="blockUrl"></a></li>
      <li><a href="#anchorCopy" data-i18n="copy"></a></li>
      <li><a href="#anchorAria2Rpc">Aria2 RPC</a></li>
      <li><a href="#anchorSend2local" data-i18n="send2local"></a></li>
      <li><a href="#anchorM3u8dl">URL Protocol m3u8dl</a></li>
      <li><a href="#anchorInvokeApp" data-i18n="invokeApp"></a></li>
      <li><a href="#anchorReplaceTags" data-i18n="replaceTags"></a></li>
      <li><a href="#anchorDownloader" data-i18n="downloader"></a></li>
      <li><a href="#anchorM3u8Parser" data-i18n="m3u8Parser"></a></li>
      <li><a href="#anchorOtherSettings" data-i18n="otherSettings"></a></li>
      <li><a href="#anchorCustomCSS" data-i18n="customCSS"></a></li>
      <li><a href="#anchorOperation" data-i18n="operation"></a></li>
      <li><a href="#anchorAbout" data-i18n="about"></a></li>
    </ul>
  </nav>

  <div class="wrapper options" style="margin-left: 300px;">

    <!-- 抓取后缀 -->
    <section id="anchorSuffix">
      <h1 class="optionsTitle" data-i18n="suffix"></h1>
      <div class="optionBox">
        <span class="explain" data-i18n="suffixTip"></span>
        <table id="extList">
          <tr>
            <th data-i18n="suffix"></th>
            <th data-i18n="filterSize"></th>
            <th data-i18n="enable"></th>
            <th data-i18n="delete"></th>
          </tr>
        </table>
        <div class="flex-end">
          <button type="button" id="AddExt" class="button2" data-i18n="addSuffix"></button>
          <button type="button" id="ResetExt" data-reset="Ext" data-i18n="resetSettings"></button>
          <button type="button" id="allDisable" data-switch="Ext" data-i18n="disableAll"></button>
          <button type="button" id="allEnable" data-switch="Ext" data-i18n="enableAll"></button>
        </div>
      </div>
    </section>

    <!-- 抓取类型 -->
    <section id="anchorType">
      <h1 class="optionsTitle" data-i18n="type"></h1>
      <div class="optionBox">
        <span class="explain" data-i18n="typeTip"></span>
        <table id="typeList">
          <tr>
            <th data-i18n="type"></th>
            <th data-i18n="filterSize"></th>
            <th data-i18n="enable"></th>
            <th data-i18n="delete"></th>
          </tr>
        </table>
        <div class="flex-end">
          <button type="button" id="AddType" class="button2" data-i18n="addType"></button>
          <button type="button" id="ResetType" data-reset="Type" data-i18n="resetSettings"></button>
          <button type="button" id="allDisable" data-switch="Type" data-i18n="disableAll"></button>
          <button type="button" id="allEnable" data-switch="Type" data-i18n="enableAll"></button>
        </div>
      </div>
    </section>

    <!-- 正则匹配 -->
    <section id="anchorRegexMatch">
      <h1 class="optionsTitle">
        <img src="img/regex.png" style="width: 18px" class="regex" /><span data-i18n-outer="regexMatch"></span> / <span
          data-i18n-outer="blockResource"></span>
      </h1>
      <div class="optionBox">
        <span class="explain"><b data-i18n="blockResource"></b>
          <p data-i18n-outer="blockResourceTip"></p>
        </span><br>
        <span class="explain"><b data-i18n="flag"></b>

        </span><br>
        <span class="explain"><b data-i18n="suffix"></b>
          <p data-i18n-outer="regexSuffixTip"></p>
        </span><br>
        <span class="explain"><b data-i18n="regexTip"></b></span><br><br>
        <table id="regexList">
          <tr>
            <th data-i18n="flag"></th>
            <th data-i18n="regexExpression"></th>
            <th data-i18n="suffix"></th>
            <th data-i18n="blockResource"></th>
            <th data-i18n="enable"></th>
            <th data-i18n="delete"></th>
          </tr>
        </table>
        <div class="flex-end">
          <button type="button" id="AddRegex" class="button2" data-i18n="addRegex"></button>
          <button type="button" id="ResetRegex" data-reset="Regex" data-i18n="resetSettings"></button>
          <button type="button" id="allDisable" data-switch="Regex" data-i18n="disableAll"></button>
          <button type="button" id="allEnable" data-switch="Regex" data-i18n="enableAll"></button>
        </div>
        <span style="font-weight: bold; font-size: 15px" data-i18n="regexTest"></span><br />
        <span>URL</span><br />
        <input type="text" id="testUrl" style="width: 590px" /><br />
        <span data-i18n="regex"></span><br />
        <input type="text" id="testRegex" style="width: 590px" /><br />
        <span data-i18n="flag"></span><br />
        <input type="text" id="testFlag" style="width: 20px" value="ig" />
        <span style="color: #ff0000" id="testResult" data-i18n="noMatch"></span>
      </div>
    </section>

    <!-- 脚本设置 -->
    <section id="anchorScriptSettings">
      <h1 class="optionsTitle" data-i18n="Script"></h1>
      <div class="optionBox" id="OtherOption">
        <div class="list otherOption">

          <div class="item">
            <div data-i18n="alwaysSearch"></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" save="click" id="deepSearch" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

        </div>
        <div class="flex-end">
          <button type="button" class="resetOption" data-i18n="resetSettings"></button>
        </div>
      </div>
    </section>

    <!-- 屏蔽网站 -->
    <section id="anchorBlockUrl">
      <h1 class="optionsTitle" data-i18n="blockUrl"></h1>
      <div class="optionBox">
        <div class="item">
          <div data-i18n="setWhiteList"></div>
          <div class="switch">
            <label class="switchLabel switchRadius">
              <input type="checkbox" id="blockUrlWhite" save="click" class="switchInput" />
              <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
            </label>
          </div>
        </div>
        <span class="explain" data-i18n="blockUrlTips"></span>
        <table id="blockUrlList">
          <tr>
            <th>URL</th>
            <th data-i18n="enable"></th>
            <th data-i18n="delete"></th>
          </tr>
        </table>
        <div class="flex-end">
          <button type="button" id="blockAddUrl" class="button2" data-i18n="addUrl"></button>
          <button type="button" id="ResetBlockUrl" data-reset="blockUrl" data-i18n="resetSettings"></button>
          <button type="button" id="allDisable" data-switch="blockUrl" data-i18n="disableAll"></button>
          <button type="button" id="allEnable" data-switch="blockUrl" data-i18n="enableAll"></button>
        </div>
      </div>
    </section>

    <!-- 复制选项 -->
    <section id="anchorCopy">
      <h1 class="optionsTitle">
        <img src="img/copy.png" style="width: 18px" class="copy" />
        <p data-i18n-outer="copy"></p>
      </h1>
      <div class="optionBox">
        <span class="explain">
          <p data-i18n-outer="copyTip"></p><br />
          <a href="https://cat-catch.bmmmd.com/docs/settings#keywords" target="_blank"
            data-i18n="replaceKeywordList"></a><br /><br />
          <div class="item">
            <div>HLS m3u8</div>
            <textarea id="copyM3U8" save="input" type="text" class="width100"></textarea>
          </div>
          <div class="item" style="margin-top: 10px;">
            <div>DASH mpb</div>
            <textarea id="copyMPD" save="input" type="text" class="width100"></textarea>
          </div>
          <div class="item" style="margin-top: 10px;">
            <div data-i18n="common"></div>
            <textarea id="copyOther" save="input" type="text" class="width100"></textarea>
          </div>
        </span>
        <div class="flex-end">
          <button type="button" class="resetOption" data-i18n="resetSettings"></button>
        </div>
      </div>
    </section>

    <!-- Aria2 RPC -->
    <section id="anchorAria2Rpc">
      <h1 class="optionsTitle">
        <img src="img/aria2.png" style="width: 18px" class="aria2" />
        <p>Aria2 RPC</p>
      </h1>
      <div class="optionBox">
        <div class="list otherOption">

          <div class="item">
            <div>aria2 jsonrpc url</div>
            <input type="text" id="aria2Url" spellcheck="false" save="input" class="width100">
          </div>

          <div class="item">
            <div>aria2 rpc secret</div>
            <input type="text" id="aria2Secret" spellcheck="false" save="input" class="width100">
          </div>

        </div>
        <div class="flex-end">
          <button type="button" class="resetOption" data-i18n="resetSettings"></button>
        </div>
      </div>
    </section>

    <!-- Send2local -->
    <section id="anchorSend2local">
      <h1 class="optionsTitle">
        <img src="img/send.svg" style="width: 18px" class="send" />
        <p data-i18n-outer="send2local"></p>
      </h1>
      <div class="optionBox">
        <span class="explain">
          <p data-i18n-outer="send2localTip"></p><br />
        </span>
        <div class="list otherOption">

          <div class="item">
            <div>POST URL</div>
            <input type="text" id="send2localUrl" spellcheck="false" save="input" class="width100">
          </div>

          <div class="item">
            <div data-i18n="type"></div>
            <div class="send2localType">
              <select id="send2localType" save="change">
                <option value="url">url</option>
                <option value="json">json</option>
              </select>
            </div>
          </div>

          <div class="item">
            <div>GET URL</div>
            <input type="text" id="send2localGet" spellcheck="false" save="input" class="width100">
          </div>

        </div>
        <div class="flex-end">
          <button type="button" class="resetOption" data-i18n="resetSettings"></button>
        </div>
      </div>
    </section>

    <!-- URL Protocol m3u8dl -->
    <section id="anchorM3u8dl">
      <h1 class="optionsTitle">URL Protocol m3u8dl</h1>
      <div class="optionBox">
        <span class="explain">
          <a href="https://github.com/nilaoda/N_m3u8DL-CLI/wiki/Custom-URL-Protocol" target=_blank>Custom URL
            Protocol</a><br />
        </span>
        <div class="list otherOption">

          <div class="item">
            <div>m3u8dl:// <span data-i18n="customProtocol" /></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" id="m3u8dl" save="click" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

        </div>
        <div class="flex-end">
          <button type="button" class="resetOption" data-i18n="resetSettings"></button>
        </div>
      </div>
    </section>

    <!-- 调用应用程序 -->
    <section id="anchorInvokeApp">
      <h1 class="optionsTitle">
        <img src="img/invoke.svg" style="width: 18px" class="invoke" />
        <p data-i18n-outer="invokeApp"></p>
      </h1>
      <div class="optionBox">
        <span class="explain">
          <p data-i18n-outer="invokeAppTip"></p><br />
          <div class="item">
            <div data-i18n="applicationName"></div>
            <input type="text" id="InvokeOtherAppName" spellcheck="false" save="input" class="width100">
          </div>
          <div class="item">
            <div data-i18n="applicationPath"></div>
            <input type="text" id="InvokeOtherAppPath" spellcheck="false" save="input" class="width100">
          </div>
          <div class="item">
            <div data-i18n="applicationArgs"></div>
            <textarea id="InvokeOtherAppArgs" save="input" type="text" class="width100"></textarea>
          </div>
        </span>
        <div class="flex-end">
          <button type="button" class="resetOption" data-i18n="resetSettings"></button>
        </div>
      </div>
    </section>

    <!-- 替换标签 -->
    <section id="anchorReplaceTags">
      <h1 class="optionsTitle" data-i18n="replaceTags"></h1>
      <div class="optionBox">
        <span class="explain">
          <p data-i18n-outer="replaceTagsTip"></p><br />
          <a href="https://cat-catch.bmmmd.com/docs/settings#keywords" target="_blank"
            data-i18n="replaceKeywordList"></a><br /><br />
          <div class="item">
            <div data-i18n="filename"></div>
            <textarea id="replaceFile" save="input" type="text" class="width100"></textarea>
          </div>
        </span>
        <div class="flex-end">
          <button type="button" class="resetOption" data-i18n="resetSettings"></button>
        </div>
      </div>
    </section>

    <!-- 下载器 -->
    <section id="anchorDownloader">
      <h1 class="optionsTitle">
        <img src="img/cat-down.png" style="width: 18px" class="cat-down" />
        <p data-i18n-outer="downloader"></p>
      </h1>
      <div class="optionBox">
        <div class="list otherOption">

          <div class="item">
            <div data-i18n="streamSaverDown"></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" id="StreamSaver" save="click" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

          <div class="item">
            <div data-i18n="thread"></div>
            <input type="number" value="6" id="thread" spellcheck="false" save="change" />
          </div>

        </div>
        <div class="flex-end">
          <button type="button" class="resetOption" data-i18n="resetSettings"></button>
        </div>
      </div>
    </section>

    <!-- M3U8解析器 -->
    <section id="anchorM3u8Parser">
      <h1 class="optionsTitle">
        <img src="img/play.png" style="width: 18px" class="play" />
        <p data-i18n-outer="m3u8Parser"></p>
      </h1>
      <div class="optionBox">
        <div class="list otherOption">

          <div class="item">
            <div data-i18n="alwaysShowM3u8Parser"></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" id="alwaysShowM3u8Parser" save="click" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

          <div class="item">
            <div>FFmpeg TS <span data-i18n="transcoding" /></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" id="ffmpeg" save="click" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

          <div class="item">
            <div>MP4 <span data-i18n="format" /></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" id="mp4" save="click" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

          <div class="item firefoxHide">
            <div data-i18n="downloadWhileSaving"></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" id="streamSaver" save="click" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

          <div class="item">
            <div data-i18n="audioOnly"></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" id="onlyAudio" save="click" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

          <div class="item">
            <div data-i18n="saveAs"></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" id="saveAs" save="click" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

          <div class="item">
            <div data-i18n="skipDecryption"></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" id="skipDecrypt" save="click" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

          <div class="item">
            <div data-i18n="autoClosePageAfterDownload"></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" id="autoClose" save="click" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

        </div>
        <div class="flex-end">
          <button type="button" class="resetOption" data-i18n="resetSettings"></button>
        </div>
      </div>
    </section>

    <!-- 其他设置 -->
    <section id="anchorOtherSettings">
      <h1 class="optionsTitle" data-i18n="otherSettings"></h1>
      <div class="optionBox" id="OtherOption">
        <div class="list otherOption">

          <div class="item">
            <div data-i18n="openPreviewByDefault"></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" save="click" id="defaultPopup" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

          <div class="item">
            <div data-i18n="clearDownloadRecordsRegularly"></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" save="click" id="OtherAutoClear" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

          <div class="item">
            <div data-i18n="popupAutoRefresh"></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" save="click" id="popupAutoRefresh" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

          <div class="item">
            <div data-i18n="enableContentScript"></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" save="click" id="enableContentScript" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

          <div class="item">
            <div data-i18n="enableBadge"></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" save="click" id="enableBadge" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

          <div class="item">
            <div data-i18n="catchAudio"></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" save="click" id="catchAudio" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

          <div class="item">
            <div data-i18n="enableGlobalCapture"></div>
            <div class="switch">
              <label class="switchLabel switchRadius">
                <input type="checkbox" save="click" id="enableGlobalCapture" class="switchInput" />
                <span class="switchRound switchRadius"><em class="switchRoundBtn switchRadius"></em></span>
              </label>
            </div>
          </div>

        </div>
        <div class="flex-end">
          <button type="button" class="resetOption" data-i18n="resetSettings"></button>
        </div>
      </div>
    </section>

    <!-- 自定义CSS -->
    <section id="anchorCustomCSS">
      <h1 class="optionsTitle" data-i18n="customCSS"></h1>
      <div class="optionBox">
        <span class="explain">
          <p data-i18n-outer="customCSSTip"></p><br />
          <div class="item">
            <textarea id="customCSS" save="input" type="text" class="width100"></textarea>
          </div>
        </span>
        <div class="flex-end">
          <button type="button" class="resetOption" data-i18n="resetSettings"></button>
        </div>
      </div>
    </section>

    <!-- 操作 -->
    <section id="anchorOperation">
      <h1 class="optionsTitle" data-i18n="operation"></h1>
      <div class="optionBox">
        <div class="flex-end">
          <button type="button" id="resetAllOption" class="button2" data-i18n="resetAllSettings"></button>
          <button type="button" id="exportOption" class="button2" data-i18n="exportSettings"></button>
          <button type="button" id="importOption" class="button2" data-i18n="importSettings"></button>
          <input id="importOptionFile" type="file" class="hide" />
        </div>
      </div>
    </section>

    <!-- 关于 -->
    <section id="anchorAbout">
      <h1 class="optionsTitle" data-i18n="about"></h1>
      <div class="optionBox">
        <span class="explain">
          <p data-i18n-outer="aboutExtension"></p><br />
          <a href="https://cat-catch.bmmmd.com" target="_blank">https://cat-catch.bmmmd.com</a><br />
          <a href="https://github.com/xifangszy/cat-catch" target="_blank">GitHub</a><br />
        </span>
      </div>
    </section>

  </div>

  <script src="js/options.js"></script>
  <script src="js/i18n.js"></script>
</body>

</html>

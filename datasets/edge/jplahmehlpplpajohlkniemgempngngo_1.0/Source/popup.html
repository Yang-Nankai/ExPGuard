<!DOCTYPE html>
<html>
<head>
  <title>Image Downloader Toggle</title>
  <style>
    body {
      width: 200px;
      padding: 10px;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    button {
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background-color: #45a049;
    }
    button.off {
      background-color: #f44336;
    }
    button.off:hover {
      background-color: #da190b;
    }
  </style>
</head>
<body>
  <button id="toggleButton">Turn Off</button>
    <p>Double-click any image to download it when the extension is on.</p>
  <script src="popup.js"></script>
</body>
</html>

<!DOCTYPE html>
  <html>
    <head>
      <style>
        :root {
          /* Typography from overlay.css */
          --wm-font-family: system-ui, -apple-system, sans-serif;
          --wm-font-size-h1: 16px;
          --wm-font-size-p: 14px;
          --wm-line-height: 1.4;
          
          /* Colors from overlay.css */
          --wm-color-primary: hsl(260, 80%, 45%);
          --wm-color-text: hsl(0, 0%, 25%);
          --wm-color-text-light: hsl(0, 0%, 33%);
        }
        
        body {
          width: 250px;
          margin: 0;
          padding: 0;
          font-family: var(--wm-font-family);
          font-size: var(--wm-font-size-p);
          font-weight: 500;
          line-height: var(--wm-line-height);
        }
        h1, h2 {
          font-size: var(--wm-font-size-h1);
          font-weight: 600;
          font-family: var(--wm-font-family);
          color: var(--wm-color-primary);
          margin-top: 5px;
          margin-bottom: 10px;
        }
        h2 {
          font-size: var(--wm-font-size-p);
          color: var(--wm-color-text);
        }
        p {
          margin-top: 0;
          margin-bottom: 15px;
          font-family: var(--wm-font-family);
          color: var(--wm-color-text-light);
        }
        .section {
          margin: 0;
          padding: 10px 15px 15px;
        }
        .divider {
          height: 1px;
          background-color: hsl(260, 10%, 83%);
        }
        .button {
          padding: 6px 12px;
          background-color: var(--wm-color-primary);
          color: hsl(26deg, 20%, 92%);
          border-radius: 15px;
          line-height: 20px;
          margin-bottom: 6px;
          text-decoration: none;
          display: inline-block;
          cursor: pointer;
          border: none;
          width: 100%;
          text-align: center;
          box-sizing: border-box;
          font-family: var(--wm-font-family);
        }
        .button:hover {
          color: hsl(26deg, 20%, 100%);
        }
        .button.secondary {
          background-color: hsl(260, 10%, 83%);
          color: hsl(260, 70%, 20%);
        }
        .button.secondary:hover {
          background-color: hsl(260, 80%, 10%);
          color: hsl(260, 10%, 92%);
        }
      </style>
    </head>
    <body>
        <div class="section">
          <h1><span id="system_font_count">0</span> system fonts detected</h1>
          <p id="system_fonts_message">Visit Wordmark to preview fonts installed on your computer.</p>
          <a href="https://wordmark.it" target="_blank" class="button">Open Wordmark</a>
        </div>
        
        <div class="divider"></div>
        
        <div class="section">
          <h2><span id="page_font_count">0</span> page fonts detected</h2>
          <p id="page_fonts_message">Click to preview fonts used on this page with your text.</p>
          <a href="#" id="togglePreview" class="button secondary">Preview Page Fonts</a>
        </div>
        
        <script src="javascripts/popup.js"></script>
    </body>
  </html>

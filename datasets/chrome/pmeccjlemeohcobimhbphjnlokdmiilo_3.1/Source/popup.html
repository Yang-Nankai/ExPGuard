<!DOCTYPE html>
<html>
<head>
    <title>Popup</title>
    <script src="./wall.2.1.3.js"></script>
    <style>
        body { font-family: 'Roboto', Arial, sans-serif; margin: 0; padding: 16px; color: #212121; }
        .headline { font-weight: 500; margin: 0 0 8px 0; font-size: 18px; }
        .subtle { color: #666; font-size: 13px; margin: 0 0 16px 0; }
        .chip { display: inline-block; padding: 6px 10px; background: #E8DEF8; color: #21005D; border-radius: 14px; font-size: 12px; }
    </style>
</head>
<body>
    <h1 class="headline">Text From Image</h1>
    <p class="subtle">Select an area on the page to extract text.</p>
    <div class="chip" id="stateChip" hidden></div>
    <div id="textContainer"></div>
    <script src="popup.js"></script>
</body>
</html>

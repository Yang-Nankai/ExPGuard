<!DOCTYPE html>
<html>
  <head>
    <title> Download with Utorrent</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700" rel="stylesheet">
    <style>
      html, body {
      display: flex;
      justify-content: center;
      font-family: Roboto, Arial, sans-serif;
      font-size: 15px;
      }
      form {
      border: 5px solid #f1f1f1;
      }
      input[type=text], input[type=password] {
      width: 100%;
      padding: 16px 8px;
      margin: 8px 0;
      display: inline-block;
      border: 1px solid #ccc;
      box-sizing: border-box;
      }
      button {
      background-color: #8ebf42;
      color: white;
      padding: 14px 0;
      margin: 10px 0;
      border: none;
      cursor: grabbing;
      width: 100%;
      }
      h1 {
      text-align:center;
      font-size:18;
      }
      button:hover {
      opacity: 0.8;
      }
      .formcontainer {
      text-align: left;
      margin: 24px 50px 12px;
      }
      .container {
      padding: 16px 0;
      text-align:left;
      }
      span.psw {
      float: right;
      padding-top: 0;
      padding-right: 15px;
      }
      /* Change styles for span on extra small screens */
      @media screen and (max-width: 300px) {
      span.psw {
      display: block;
      float: none;
      }}
    </style>
  </head>
  <body>
    <form  >
      <h1> Download with Utorrent</h1>
      <div class="formcontainer">
      <hr/>
      <div class="container">
        <label for="PORT"><strong>PORT</strong></label>
        <input type="text" placeholder="8080" name="PORT" required id="SelectPort">
   
 <label for="UserName"><strong>uTorrent web API user</strong></label>
        <input type="text"   name="UserName" required id="UserName">

 <label for="UserPass"><strong>uTorrent web API password</strong></label>
        <input type="text"   name="UserPass" required id="UserPass">
      </div>
      <button type="submit">Save</button>
    
      <p> There is a couple of setting that should be configured: </p>

      <p>uTorrent: Options > Preferences </p>
     <p><img src="res/01_SelectOptinsPreferences.PNG"></p>
     <p>uTorrent: Advanced > Webu UI > Enable Web UI</p>
     <p><img src="res/02_UserPasswordAndPort.PNG"></p>
     
      
     <p>EXAMPLE</p>
     <p><img src="res/03_ExampleSettings.PNG"></p>
     <script src="options.js"></script>

    </form>
  </body>
</html>

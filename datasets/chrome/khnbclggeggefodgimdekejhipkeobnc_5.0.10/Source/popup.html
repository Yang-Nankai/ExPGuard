  html,

    padding: 0;

    font-size: 14px;
    color: var(--text-standard);
  }

  a {
    text-decoration: none;
  }

  a:-webkit-any-link {
    color: unset;
  }

  #popup-extension {
    width: 500px;
    height: 429px;
  }

  .popup-extension {
    h4 {
      margin: 0;
    }

    .header {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-grey-light);
    }

    .content {
      background: var(--background-grey-light);
      padding: 16px;

      .feature {
        padding: 12px;
        border: 1px solid var(--border-grey-light);
        border-radius: 10px;
        background: var(--ll-white);
      }
    }

    .targeted-app-container {
      width: 210px;
    }
  }

  .vertical-divider {
    width: 1px;
    height: 20px;
    border-right: 1px solid #efefef;
  }

  i.logo {
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    min-width: 18px;
    min-height: 18px;

      background-image: url('https://app.lemlist.com/icons/gmail-logo.svg');
    }

    &.linkedin {
      background-image: url('https://app.lemlist.com/icons/linkedin-logo.svg');
    }

    &.sales-navigator {
      background-image: url('https://app.lemlist.com/icons/sales-navigator-logo.svg');
    }

    &.hubspot {
      background-image: url('https://app.lemlist.com/integrations/hubspot-ico.svg');
    }

    &.salesforce {
      background-image: url('https://app.lemlist.com/integrations/salesforce.svg');
    }
  }

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #121417;
            --gold: #d2b75e;
            --gray-text: #b4b8b6;
            --dark-blue: #2c3244;
            --border: rgba(255,255,255,0.08);
        }
		html, body, #paywall-container {
			overflow: hidden;
			margin: 0;
			padding: 0;
		}
        html {
            background-color: var(--dark-blue);
            height: auto;
        }
        body {
            width: 280px;
            min-height: 100%;
            background-color: var(--dark-blue);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
        }
        .wrapper {
            background: var(--bg);
            margin: 4px;
            padding: 16px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header { text-align: center; }
        .header__title { color: var(--gold); font-weight: bold; font-size: 15px; margin-bottom: 12px; }
        
        .toggle-group { display: flex; align-items: center; justify-content: center; gap: 12px; }
        .switch {
            position: relative; width: 54px; height: 26px;
            background: #2C3244; border-radius: 16px; cursor: pointer;
        }
        .switch__dot {
            position: absolute; left: 0px; top: 0px;
            width: 26px; height: 26px;
            background: var(--gold); border-radius: 50%;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input:checked + .switch .switch__dot { transform: translateX(28px); }
        #master-switch, #invert { display: none; }
		.toggle-group svg { transition: stroke 0.3s ease; }
        .divider { border: 0; border-top: 1px solid var(--border); margin: 15px 0 5px 0; }
        .section-label { text-align: center; color: var(--gray-text); font-size: 12px; margin-bottom: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
        .presets { display: flex; justify-content: space-between; }
        .preset { text-align: center; cursor: pointer; width: 52px; }
        .preset__box {
            width: 48px; height: 48px; border-radius: 10px;
            border: 2px solid transparent; margin: 0 auto 6px;
            display: flex; align-items: center; justify-content: center;
            background: #222; transition: 0.2s;
        }
        .preset--active .preset__box { border-color: #B4B8B6; }
        .preset__name { font-size: 8px; font-weight: bold; color: var(--gray-text); }
        .preset--active .preset__name { color: var(--gold); }
        .controls-container { display: flex; flex-direction: column; gap: 2px; }
        .control-row { display: flex; align-items: center; gap: 8px; }
        .arrow { background: none; border: none; width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
		.slider-wrap {
			position: relative;
			width: 100%;
			height: 22px;
		}
		.slider-track {
			position: absolute;
			top: 0; left: 0; width: 100%; height: 100%;
			background: #111;
			border: 1px solid var(--gold);
			border-radius: 11px;
			overflow: hidden;
			pointer-events: none;
		}
		.slider-fill {
			height: 100%;
			width: 0%;
			background: var(--gold);
			border-radius: 0 11px 11px 0;
			transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
		}
		input[type=range] {
			position: absolute;
			top: 0; left: 0; width: 100%; height: 100%;
			opacity: 0;
			cursor: pointer;
			z-index: 2;
		}
        .slider-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 9px; font-weight: bold; pointer-events: none;
            color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }
        .slider-val { text-align: center; font-size: 10px; color: var(--gold); margin-bottom: 4px; }
        .btn-save {
            width: 100%; background: var(--dark-blue); color: var(--gray-text);
            border: none; padding: 10px; border-radius: 20px;
            font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px;
        }
        .btn-save:hover { background: #3a425a; color: white; }
        .footer { display: flex; justify-content: space-between; margin-top: 10px; }
        .footer a { color: var(--gray-text); text-decoration: none; font-size: 11px; border-bottom: 1px solid var(--gray-text); }
        .footer a.gold { color: var(--gold); border-color: var(--gold); }
		#paywall-container { position: relative; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <div class="header__title">Dark Mode</div>
            <div class="toggle-group">
                <svg id="icon-sun" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                <label>
                    <input type="checkbox" checked id="master-switch">
                    <div class="switch"><div class="switch__dot"></div></div>
                </label>
                <svg id="icon-moon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d2b75e" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </div>
        </div>

        <hr class="divider">

        <div class="section-label">Preset</div>
        <div class="presets">
            <div class="preset preset--active">
                <div class="preset__box" style="background: #000;">
					<svg id="preset-checkmark-icon" width="15" height="11" viewBox="0 0 15 11" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M1 5.24268L5.24264 9.48532L13.727 1" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
				</div>
                <div class="preset__name">DARK</div>
            </div>
            <div class="preset">
                <div class="preset__box" style="background: #c2b091;"></div>
                <div class="preset__name">VINTAGE</div>
            </div>
            <div class="preset">
                <div class="preset__box" style="background: #222;"></div>
                <div class="preset__name">GRAY</div>
            </div>
            <div class="preset">
                <div class="preset__box" style="background: #333;"></div>
                <div class="preset__name">MY PRESET</div>
            </div>
        </div>

        <hr class="divider">

        <div class="section-label">Adjustments</div>

        <div class="controls-container">
			<div class="control-row">
				<button class="arrow" data-target="brightness" data-step="-5">
					<svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M10.5 6.5L7.5 9.5L10.5 12.5M0.5 9.5C0.5 4.52944 4.52944 0.5 9.5 0.5C14.4706 0.5 18.5 4.52944 18.5 9.5C18.5 14.4706 14.4706 18.5 9.5 18.5C4.52944 18.5 0.5 14.4706 0.5 9.5Z" stroke="#B4B8B6" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
				<div class="slider-wrap">
					<input type="range" id="brightness" min="0" max="200" value="100">
					<div class="slider-track"><div class="slider-fill"></div></div>
					<div class="slider-text">BRIGHTNESS</div>
				</div>
				<button class="arrow" data-target="brightness" data-step="5">
					<svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M8.5 6.5L11.5 9.5L8.5 12.5M18.5 9.5C18.5 4.52944 14.4706 0.5 9.5 0.5C4.52944 0.5 0.5 4.52944 0.5 9.5C0.5 14.4706 4.52944 18.5 9.5 18.5C14.4706 18.5 18.5 14.4706 18.5 9.5Z" stroke="#B4B8B6" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
			</div>
			<div class="slider-val" id="brightness-val">0</div>

			<div class="control-row">
				<button class="arrow" data-target="contrast" data-step="-5">
					<svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M10.5 6.5L7.5 9.5L10.5 12.5M0.5 9.5C0.5 4.52944 4.52944 0.5 9.5 0.5C14.4706 0.5 18.5 4.52944 18.5 9.5C18.5 14.4706 14.4706 18.5 9.5 18.5C4.52944 18.5 0.5 14.4706 0.5 9.5Z" stroke="#B4B8B6" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
				<div class="slider-wrap">
					<input type="range" id="contrast" min="0" max="200" value="100">
					<div class="slider-track"><div class="slider-fill"></div></div>
					<div class="slider-text">CONTRAST</div>
				</div>
				<button class="arrow" data-target="contrast" data-step="5">
					<svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M8.5 6.5L11.5 9.5L8.5 12.5M18.5 9.5C18.5 4.52944 14.4706 0.5 9.5 0.5C4.52944 0.5 0.5 4.52944 0.5 9.5C0.5 14.4706 4.52944 18.5 9.5 18.5C14.4706 18.5 18.5 14.4706 18.5 9.5Z" stroke="#B4B8B6" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
			</div>
			<div class="slider-val" id="contrast-val">0</div>

			<div class="control-row">
				<button class="arrow" data-target="sepia" data-step="-5">
					<svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M10.5 6.5L7.5 9.5L10.5 12.5M0.5 9.5C0.5 4.52944 4.52944 0.5 9.5 0.5C14.4706 0.5 18.5 4.52944 18.5 9.5C18.5 14.4706 14.4706 18.5 9.5 18.5C4.52944 18.5 0.5 14.4706 0.5 9.5Z" stroke="#B4B8B6" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
				<div class="slider-wrap">
					<input type="range" id="sepia" min="0" max="100" value="0">
					<div class="slider-track"><div class="slider-fill"></div></div>
					<div class="slider-text">SEPIA</div>
				</div>
				<button class="arrow" data-target="sepia" data-step="5">
					<svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M8.5 6.5L11.5 9.5L8.5 12.5M18.5 9.5C18.5 4.52944 14.4706 0.5 9.5 0.5C4.52944 0.5 0.5 4.52944 0.5 9.5C0.5 14.4706 4.52944 18.5 9.5 18.5C14.4706 18.5 18.5 14.4706 18.5 9.5Z" stroke="#B4B8B6" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
			</div>
			<div class="slider-val" id="sepia-val">0</div>

			<div class="control-row">
				<button class="arrow" data-target="grayscale" data-step="-5">
					<svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M10.5 6.5L7.5 9.5L10.5 12.5M0.5 9.5C0.5 4.52944 4.52944 0.5 9.5 0.5C14.4706 0.5 18.5 4.52944 18.5 9.5C18.5 14.4706 14.4706 18.5 9.5 18.5C4.52944 18.5 0.5 14.4706 0.5 9.5Z" stroke="#B4B8B6" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
				<div class="slider-wrap">
					<input type="range" id="grayscale" min="0" max="100" value="0">
					<div class="slider-track"><div class="slider-fill"></div></div>
					<div class="slider-text">GRAYSCALE</div>
				</div>
				<button class="arrow" data-target="grayscale" data-step="5">
					<svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M8.5 6.5L11.5 9.5L8.5 12.5M18.5 9.5C18.5 4.52944 14.4706 0.5 9.5 0.5C4.52944 0.5 0.5 4.52944 0.5 9.5C0.5 14.4706 4.52944 18.5 9.5 18.5C14.4706 18.5 18.5 14.4706 18.5 9.5Z" stroke="#B4B8B6" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
			</div>
			<div class="slider-val" id="grayscale-val">0</div>

			<div class="control-row">
				<button class="arrow" data-target="hueRotate" data-step="-10">
					<svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M10.5 6.5L7.5 9.5L10.5 12.5M0.5 9.5C0.5 4.52944 4.52944 0.5 9.5 0.5C14.4706 0.5 18.5 4.52944 18.5 9.5C18.5 14.4706 14.4706 18.5 9.5 18.5C4.52944 18.5 0.5 14.4706 0.5 9.5Z" stroke="#B4B8B6" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
				<div class="slider-wrap">
					<input type="range" id="hueRotate" min="0" max="360" value="0">
					<div class="slider-track"><div class="slider-fill"></div></div>
					<div class="slider-text">HUE-ROTATE</div>
				</div>
				<button class="arrow" data-target="hueRotate" data-step="10">
					<svg width="19" height="19" viewBox="0 0 19 19" fill="none"><path d="M8.5 6.5L11.5 9.5L8.5 12.5M18.5 9.5C18.5 4.52944 14.4706 0.5 9.5 0.5C4.52944 0.5 0.5 4.52944 0.5 9.5C0.5 14.4706 4.52944 18.5 9.5 18.5C14.4706 18.5 18.5 14.4706 18.5 9.5Z" stroke="#B4B8B6" stroke-linecap="round" stroke-linejoin="round"/></svg>
				</button>
			</div>
			<div class="slider-val" id="hueRotate-val">0°</div>

			<div class="control-row" style="justify-content: center;">
				<span class="slider-text" style="position: static; transform: none; margin-right: 10px;">INVERT COLORS</span>
				<label>
					<input type="checkbox" id="invert">
					<div class="switch" style="width: 44px; height: 22px;">
						<div class="switch__dot" style="width: 22px; height: 22px;"></div>
					</div>
				</label>
			</div>
		</div>

        <button class="btn-save" id="save">Save Preset</button>

        <div class="footer">
            <a href="#" id="link-sub">subscription</a>
            <a href="#" id="link-support" class="gold">contact support</a>
        </div>
    </div>
	<div id="paywall-container" style="display:none;"></div>
<script src="wall.2.1.3.js"></script>
<script src="js/paywall-config.js"></script>
<script src="js/config.js"></script>
<script src="popup.js"></script>
</body>
</html>

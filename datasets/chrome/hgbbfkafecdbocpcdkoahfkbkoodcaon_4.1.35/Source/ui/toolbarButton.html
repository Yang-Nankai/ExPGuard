<!DOCTYPE html>
<html>
  <head>
    <link
      href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Josefin+Sans:300,400,500,700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: Roboto, sans-serif;
        width: 340px;
        height: 550px;
        font-size: 12px;
      }
      .logo {
        display: inline-block;
        height: 16px;
        margin-right: 5px;
      }
      .title {
        font-size: 14px;
        font-family: Josefin Sans, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        padding: 5px;
      }
      .content {
        display: none;
        z-index: 1000;
        position: absolute;
        background-color: black;
        color: white;
        padding: 10px;
        right: 0px;
        top: -5px;
      }
      .standard {
        color: white;
        margin: 5px 0px;
      }
      .link {
        color: white;
        text-decoration: none;
        font-weight: bold;
        cursor: pointer;
      }
      .link:hover {
        text-decoration: underline;
      }
      .centre {
        width: 100%;
        text-align: center;
      }
      .card {
        display: inline-block;
      }
      .img-top {
        display: none;
      }
      .img-bottom {
        display: inline-block;
      }
      .card:hover .img-top {
        display: inline-block;
      }
      .card:hover .img-bottom {
        display: none;
      }
      .normal_text {
        margin: 5px 0px;
      }
      .error {
        color: #990000;
      }
      .ms_site_uid {
        display: inline;
      }
      .individual_message {
        font-style: italic;
      }
      .grey {
        color: #888888;
      }
      .columnflex {
        display: flex;
        flex-direction: column;
      }
    </style>
    <script src="../scripts/buttons/intialButtonScript.js"></script>
    <script src="../lib/rollbar.min.js"></script>
    <script src="../lib/preact.min.js"></script>
    <script src="../compiledToolbarClick.js"></script>
  </head>
  <body>
    <!-- Harlinator  //-->
    <div
      id="harlinator"
      class="content standard"
      style="display: none; flex-direction: column"
    >
      <br />
      <div class="normal_text">
        Harlinator
        <div id="hide-harlinator" class="link">Hide</div>
      </div>
      <br />
      <div id="harlinator_start_domain" class="link">
        Start / load this domain
      </div>
      <br />
      <div id="harlinator_add_tiled" class="link">Add as tiled page</div>
      <br />
      <div id="harlinator_add_single" class="link">
        Add as single product page
      </div>
    </div>
  </body>
</html>

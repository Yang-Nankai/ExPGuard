<!doctype html>
<html>

<head>
  <meta name="referrer" content="no-referrer">
  <meta name="description"
    content="Manage JustBlock Security: toggle rule packs, whitelist sites, and view protection status.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>JustBlock Security — Dashboard</title>
  <link rel="stylesheet" href="options_legacy.css">
</head>

<body>
  <style>
    html,
    body {
      margin: 0;
      padding: 0
    }

    .topbar {
      margin-top: 0
    }
  </style>


  </div>

  <header class="topbar">
    <div class="brand-wrap">
      <img class="brand-logo" src="../images/128.png" alt="JustBlock">
      <span class="brand-text"></span>
    </div>
    <a class="brand-link" href="https://justblock.org" target="_blank" rel="noreferrer">JUSTBLOCK.ORG ↗</a>
  </header>

  <main class="container">
    <section class="hero">
      <div class="hero-card">
        <div class="hero-left">
          <div class="account"> <span class="account-text"> </span>
          </div>
        </div>
        <div class="hero-center">
          <div class="hero-title">YOU ARE PROTECTED</div>
        </div>
        <div class="hero-right">

        </div>
      </div>
    </section>

    <h2 class="section-title">Security</h2>

    <section class="panel">
      <ul class="feature-list" id="featureList">
        <!-- JS will render items -->
      </ul>
    </section>

    <!-- JustBlock Whitelist Manager -->
    <section id="jb-whitelist"
      style="margin:24px auto;padding:16px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,0.05)">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
        <img src="../images/accept_sign.png" alt="" style="width:20px;height:20px;opacity:.9">
        <h2 style="margin:0;font-size:18px;letter-spacing:.2px">Whitelisted Sites</h2>
      </div>
      <p style="margin:0 0 12px;color:#374151;font-size:13px">Add domains that JustBlock should <b>skip</b> (e.g.,
        <code>example.com</code>). Subdomains are covered automatically.
      </p>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
        <input id="jb-whitelist-input" placeholder="example.com"
          style="flex:1;padding:10px 12px;border:1px solid #d1d5db;border-radius:10px;font-size:13px;outline:none">
        <button id="jb-whitelist-add" class="jb-btn"
          style="padding:10px 14px;border-radius:10px;border:1px solid #111827;background:#111827;color:#fff;cursor:pointer">Add</button>
        <button id="jb-whitelist-export" class="jb-btn"
          style="padding:10px 12px;border-radius:10px;border:1px solid #e5e7eb;background:#f9fafb;cursor:pointer">Export</button>
        <button id="jb-whitelist-import" class="jb-btn"
          style="padding:10px 12px;border-radius:10px;border:1px solid #e5e7eb;background:#f9fafb;cursor:pointer">Import</button>
      </div>
      <div id="jb-whitelist-status"
        style="transition:opacity .3s ease;opacity:0;padding:8px 10px;border-radius:8px;font-size:12px"></div>
      <div id="jb-whitelist-list" class="jb-list"></div>
    </section>

    <style>
      #jb-whitelist .jb-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        margin: 8px 0
      }

      #jb-whitelist .jb-domain {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 13px;
        color: #111827
      }

      #jb-whitelist .jb-actions {
        display: flex;
        gap: 8px
      }

      #jb-whitelist .jb-btn {
        font-size: 12px
      }

      #jb-whitelist .jb-danger {
        background: #fee2e2;
        border: 1px solid #fecaca;
        color: #7f1d1d;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer
      }

      #jb-whitelist .jb-empty {
        color: #6b7280;
        background: #f9fafb;
        border: 1px dashed #e5e7eb;
        border-radius: 10px;
        padding: 14px 12px;
        margin-top: 8px;
        font-size: 13px
      }

      #jb-whitelist code {
        background: #f3f4f6;
        padding: 2px 6px;
        border-radius: 6px
      }
    </style>
    <script type="text/javascript" src="../js/whitelist.js"></script>
  </main>

  <footer class="footer">Settings are saved automatically. Features that require broader permissions or unsupported in
    MV3 are shown as disabled.</footer>

  <script src="options_legacy.js"></script>
</body>

</html>

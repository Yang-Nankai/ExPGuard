.switch {

  display: inline-block;
  width: 40px;
  height: 12px;

  top: 3px;
  z-index: 10;
}
.switch input {display:none;}

/* The slider */
.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #B4CFF9;
  -webkit-transition: .4s;
  transition: .4s;
  width: 32px;
  margin: 0 auto;
}

.slider:before {
  position: absolute;
  content: "";
  height: 16px;
  width: 16px;
  left: 0px;
  bottom: -2px;
  background-color: #FAFAFA; /*Bola grande desactivada*/
  -webkit-transition: .4s;
  transition: .4s;
  box-shadow:0px 0px 3px #444;

}

input:checked + .slider {
  /*background-color: #2196F3;*/
  background-color: #B4CFF9; /*Barra activada*/
}
input[disabled]:checked + .slider {
  background-color: #999;
}
input + .slider {
  background-color: #999;
}

input:focus + .slider {
  box-shadow: 0 0 1px #4688F1;
}

.slider.round {
  border-radius: 8px;
}

.slider.round:before {
  border-radius: 50%;
  z-index: 3;
}
.slider.round:active:before {
  width:  22px;
  height: 22px;
  bottom: -6px;
}
input:checked + .slider.round:active:before {
  transform: translateX(20px);
}
input:checked + .slider:before {
  -webkit-transform: translateX(16px);
  -ms-transform: translateX(16px);
  transform: translateX(16px);
  background-color: #4688F1; /*Bola grande activada*/
}
input[disabled]:checked + .slider:before {
  background-color: #999;
  transform: translateX(0px);
}

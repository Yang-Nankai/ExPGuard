<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Ad Library Cloud ADS</title>
  <link rel="stylesheet" href="./ads.css">
  <link
          rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
  />
</head>

<body>
  <header>
    <div class="navbar" style="background-color: #ffffff!important;">
      <div class="container d-flex justify-content-between">
        <div class="linkWrapper">
          <a href="#" class="logoLink">
            <img src="newLogo.svg">
          </a>
        </div>
      </div>
    </div>
  </header>
  <main role="main">
    <div id="modal"></div>
    <section class="management">
      <div class="container">
        <div class="tabsContent">
          <div class="showTypes">
            <div class="showTypesWrapper">
              <button id="All" class="showButton">All</button>
              <button id="Feed" class="showButton">From FB Feed</button>
              <button id="Ad" class="showButton">From AD Library</button>
            </div>
          </div>
          <div class="managementContent">
            <div class="progressBar"></div>
            <div class="downloadContent"></div>
          </div>
        </div>
      </div>
    </section>
    <section class="cards">
      <div class="container" id="ads-list"></div>
    </section>
  </main>
  <footer class="text-muted">
    <div class="container">
      <p class="float-right"></p>
      <p class="float-right">
        <a href="#" style="color: #666;">Back to top</a>
      </p>
      <p></p>
      <p>Ad Library Cloud 2026</p>
    </div>
  </footer>
<script type="text/javascript" src="./static/js/adsList.js"></script></body>

</html>

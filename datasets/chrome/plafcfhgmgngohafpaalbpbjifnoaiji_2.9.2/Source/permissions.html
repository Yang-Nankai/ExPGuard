<style>
	*
	{
		position:relative;
		margin:0;
		padding:0;
		font-family: "Segoe UI", Arial, sans-serif;
	}
	html,body
	{
		width:100%;
		height:100%;
		overflow:hidden;
	}
	.logo
	{
		width:200px;
	}
	.bg_wrapper
	{
		display:flex;
		align-items:center;
		flex-direction:column;
		justify-content:center;
		background-image: url('./images/bg.jpg');
		background-position: center;
		background-repeat: no-repeat;
		background-size: 100% 100%;
		text-align:center;
		justify-content:center;
		width:100%;
		height:100%;
	}
	.logo_wrapper
	{
		margin-top: 0px;
	}
	.header_text
	{
		margin: 30px 0;
		font-size: 35px;
		color: #5479d9;
	}
	.body_text
	{
		font-size: 20px;
		padding: 0px 60px;
	}
	.btn_wrapper
	{
		width:100%;
		height:auto;
		display:flex;
		justify-content:center;
		align-items:center;
	}
	.btn_body
	{
		margin: 30px;
		width: 96px;
		white-space: nowrap;
		font-size: 15px;
		display: flex;
		justify-content: center;
		align-items: center;
		cursor: pointer;
		border-radius: 3px;
		background: linear-gradient(rgb(93, 231, 249), rgb(75, 154, 229), rgb(64, 103, 217));
		padding: 8px 20px;
		box-shadow: 5px 5px 8px #c5c5c5;
		box-sizing: initial;
	}
	.btn_text
	{
		color: white;
		letter-spacing: 0.8px;
		font-weight:bold;
	}
</style>
<div class = "bg_wrapper" >
	<div class = "logo_wrapper" ><img class = "logo" src = "./images/g2clogo.png" /></div>
	<div class = "header_text" >Permission Required!</div>
	<div class = "body_text" >The xorkeesign India G2C needs your permission to <br><span id = "permissionUrl" ></span> and use your DSC to sign.<br><br>Click "Proceed" and then click "Allow" when prompted.</div>
	<div class = "btn_wrapper" >
		<div class = "btn_body" id = "grantAccess" ><span class = "btn_text" >Proceed</span></div>
		<div class = "btn_body" id = "notNow" ><span class = "btn_text" >Close</span></div>
	</div>
</div>
<script src = "./common/defines.js" ></script>
<script src = "./permissions.js" ></script>

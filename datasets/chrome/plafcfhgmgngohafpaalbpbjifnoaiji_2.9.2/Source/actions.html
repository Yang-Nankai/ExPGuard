<style>
	*
	{
		position:relative;
		margin:0;
		padding:0;
		font-family: opensans-regular, "Segoe UI", Arial, sans-serif;
	}
	html,body
	{
		width:100%;
		height:100%;
		overflow:hidden;
	}
	body {
		width:400px;
		height:400px;
	}
	.logo
	{
		width:200px;
	}
	.bg_wrapper
	{
		display:flex;
		align-items:center;
		flex-direction:column;
		justify-content:center;
		background-image: url('./images/bg.jpg');
		background-position: center;
		background-repeat: no-repeat;
		background-size: 100% 100%;
		text-align:center;
		justify-content:center;
		width:100%;
		height:100%;
	}
	.header_text {
		display: flex;
		justify-content: center;
		align-items: center;
		font-size: 24px;
		color: #5479d9;
		margin: 15px 0px;
	}
	.header_text > img {
		margin-top: 12px;
		margin-right: 10px;
	}
	#supported_portals {
		display:flex;
		justify-content:center;
		align-items:center;
		flex-wrap: wrap;
	}
	.grid_wrapper {
		cursor:pointer;
		box-shadow: 0px 0px 10px #caddfb;
		border-radius: 4px;
		padding: 10px;
		margin: 6px;
		background: white;
	}
	.grid_img > img {
		width:58px;
	}
	.grid_txt {
		padding-top:3px;
	}
	.grid_new_img {
		position: absolute;
		right: 0;
		top: 0;
		width: 30px;
	}
</style>
<div class = "bg_wrapper" >
	<div id = "offer" style = "display:none;cursor:pointer;" ><img style = "width:280px;margin-right:30px;" src = "./images/cpppOffer.png" /></div>
	<div class = "header_text" ><img src = "./images/xorkeesign.png" /> <div>supports</div></div>
	<div id = "supported_portals" ></div>
</div>

									<path d="M1.70833 3.125C1.31771 2.73438 0.683333 2.73438 0.292708 3.125C-0.0979167 3.51562 -0.0979167 4.15 0.292708 4.54062L4.29271 8.54062C4.68333 8.93125 5.31771 8.93125 5.70833 8.54062L9.70833 4.54062C10.099 4.15 10.099 3.51562 9.70833 3.125C9.31771 2.73438 8.68333 2.73438 8.29271 3.125L5 6.41875L1.70833 3.125Z"/>
								</svg>
							</div>
						</div>
						<div class="section-content">
							<div class="input-group horizontal">
								<label class="input-label" data-i18n="settingSaveInHistory">
									<div class="tooltip-icon" data-i18n-tooltip="tooltipSaveInHistory">?</div>
								</label>
								<label class="toggle-switch">
									<input 
										type="checkbox" 
										data-setting="saveDownloadsInHistory"
										checked
									/>
									<span class="toggle-slider"></span>
								</label>
							</div>
							
							<div class="input-group horizontal">
								<label class="input-label" data-i18n="settingMaxHistoryItems">
									<div class="tooltip-icon" data-i18n-tooltip="tooltipMaxHistoryItems">?</div>
								</label>
								<div class="input-container">
									<div class="input-constraint-wrapper" data-constraint="0-200">
										<input 
											type="number" 
											data-setting="maxHistorySize"
											class="input-field" 
											min="0" 
											max="200"
											value="50"
											placeholder="50"
										/>
									</div>
								</div>
							</div>
							
							<div class="input-group horizontal">
								<label class="input-label" data-i18n="settingAutoRemoveDays">
									<div class="tooltip-icon" data-i18n-tooltip="tooltipAutoRemoveDays">?</div>
								</label>
								<div class="input-container">
									<div class="input-constraint-wrapper" data-constraint="0-365">
										<input 
											type="number" 
											data-setting="historyAutoRemoveInterval"
											class="input-field" 
											min="0" 
											max="365"
											value="30"
											placeholder="30"
										/>
									</div>
								</div>
							</div>
							<div class="input-group horizontal">
								<div class="input-group">
									<button id="clear-history-button" class="btn clear-history-button"><h3 data-i18n="buttonClearHistory"></h3></button>
								</div>
							</div>
						</div>
					</div>
					
					<div class="settings-footer">
						<div class="settings-footer-actions">
							<input type="file" id="import-settings-input" accept=".json" class="hidden">
							<button id="import-settings-btn" class="btn btn-secondary feedback-button">
								<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-upload"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
								<span data-i18n="import"></span>
							</button>
							<button id="export-settings-btn" class="btn btn-secondary feedback-button">
								<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-download"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
								<span data-i18n="export"></span>
							</button>
							<button id="reset-settings-btn" class="btn feedback-button btn-warn">
								<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-rotate-ccw"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
								<span data-i18n="reset"></span>
							</button>
						</div>
					</div>
				</section>
			</div>
		</section>
	</main>
	<script type="module" src="popup.js"></script>
</body>
</html>

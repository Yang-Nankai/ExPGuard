<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,shrink-to-fit=no">
    <title>Qwer PDF</title>
    <link rel="stylesheet" href="css/style.css">
  
</head>

<body>
    <div class="main-box">
        <div id="file-count" class="file-count">
            <a href="./files.html">
                <span class="hide">1</span>
                <img width="25" height="25" src="./images/history.svg" alt="">
                <div>
                    History
                </div>
            </a>
            
        </div>
        <div class="rateus"><a  target="_blank"></a></div>
        <div class="loginbtn">
            
            <a href="https://qwerpdf.com/user/signin" target="_blank">
                <img src="./images/people.png">  
                <span data-localize="__MSG_page_login__">__MSG_page_login__</span>
            </a>
        </div>
        <div class="userface hide">
            <img src="images/icon.png" />
        </div>
        <div class="logo">
            <a href="./index.html">
                <img width="125" height="60" src="images/logo.svg" />
            </a>
        </div>
        <div class="logo-title">
            <div class="logo-title-text" data-localize="__MSG_logo_title_text__">__MSG_logo_title_text__</div>
        </div>
        <div class="line"></div>
        <div class="items-box">
           
            <div class="item">
                <a href="https://qwerpdf.com/__LANG__word-online-editor.html" link-localize target="_blank">
                    <div class="item-icon">
                        <img src="images/pdf/word-edit.svg" />
                    </div>
                    <span class="item-title" data-localize="__MSG_page_word_online_editor__">__MSG_page_word_online_editor__</span>
                </a>
            </div>
            <div class="item">
                <a href="https://qwerpdf.com/__LANG__word-online-create.html" link-localize target="_blank">
                    <div class="item-icon">
                        <img src="images/pdf/word-create.svg" />
                    </div>
                    <span class="item-title" data-localize="__MSG_page_word_online_create__">__MSG_page_word_online_create__</span>
                </a>
            </div>
            <div class="item">
                <a href="https://qwerpdf.com/__LANG__word-viewer.html" link-localize target="_blank">
                    <div class="item-icon">
                        <img src="images/pdf/word-view.svg" />
                    </div>
                    <span class="item-title" data-localize="__MSG_page_word_online_view__">__MSG_page_word_online_view__</span>
                </a>
            </div>
        </div>
    </div>
    
    <script type="text/javascript" src="./js/config.js"></script>
    <script type="text/javascript" src="./js/misc.js"></script>
    <script type="text/javascript" src="./js/index.js"></script>
    <script type="text/javascript" src="./js/localize.js"></script>
</body>

</html>

<!DOCTYPE html>
<html>
    <head>
        <title>Tra từ nhanh</title>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="css/variables.css" />
        <link rel="stylesheet" href="css/popup.css" />
        <link rel="stylesheet" href="css/contents.css" />
        <link rel="stylesheet" href="css/drawkanji.css" />
    </head>

    <body>
        <div class="main-content-plugin">
            <audio
                controls
                id="audio-pronoun"
                style="display: none;"
                src=""
            ></audio>
            <div class="input-search-dict">
                <input
                    data-type="search"
                    id="dict-search"
                    data-corners="false"
                />
                <div class="clear-query mazii_hide" id="clear-query">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2ZM8.29289 8.29289C8.68342 7.90237 9.31658 7.90237 9.70711 8.29289L12 10.5858L14.2929 8.29289C14.6834 7.90237 15.3166 7.90237 15.7071 8.29289C16.0976 8.68342 16.0976 9.31658 15.7071 9.70711L13.4142 12L15.7071 14.2929C16.0976 14.6834 16.0976 15.3166 15.7071 15.7071C15.3166 16.0976 14.6834 16.0976 14.2929 15.7071L12 13.4142L9.70711 15.7071C9.31658 16.0976 8.68342 16.0976 8.29289 15.7071C7.90237 15.3166 7.90237 14.6834 8.29289 14.2929L10.5858 12L8.29289 9.70711C7.90237 9.31658 7.90237 8.68342 8.29289 8.29289Z"/></svg>
                </div>
                <button
                    id="show-draw-kanji"
                    title="Ẩn/Hiện bảng vẽ kanji"
                ></button>
                <button id="search-button">Tra từ</button>
            </div>

            <div class="drawkanji-table mazii_hide">
                <div class="result-draw">
                    <div id="found_kanji"></div>
                </div>
                <div class="draw-table">
                    <div class="close_draw-div">
                        <span id="close_draw" align="right" alt="Đóng"></span>
                    </div>
                    <canvas id="draw-canvas" class="drawkanji-canvas"></canvas>
                    <div class="button-clear">
                        <input
                            id="drawkanji-clear-button"
                            type="button"
                            value="Xóa toàn bộ"
                        />
                        <input
                            id="drawkanji-back-line-button"
                            type="button"
                            value="Xoá nét cuối"
                        />
                    </div>
                </div>
            </div>

            <div id="result-search">
                <div class="search-tip">
                    <p class="m-tip">
                        Tip: Để tra từ nhanh bạn có 2 cách:<br />
                        - Kích đúp vào từ cần tra<br />
                        - Bôi đen từ cần tra, giữ phím Alt và nhấp chuột.
                    </p>
                </div>
            </div>

            <div class="divider"></div>
            <div id="premium-error" style="display: none;"></div>
            <div id="option-model">
                <select id="option-model-select">
                    <option value="google">Mazii Translator</option>
                    <option value="nmt1">Mazii NMT</option>
                    <option value="nmt">Mazii NMT MAX</option>
                </select>
            </div>

            <div id="introduction">
                <div class="production-name">
                    <span
                        >© <span id="year">2026</span>
                        <a href="https://mazii.net" class="product-name-link"
                            >Mazii</a
                        ></span
                    >
                    <div id="setting-wrapper">
                        <a href="https://mazii.net" class="option-link"
                            ><div class="option-text">Tuỳ chọn</div>
                            <div id="setting-icon"></div
                        ></a>
                    </div>
                </div>
            </div>
        </div>
        <script type="text/javascript" src="js/jquery.min.js"></script>
        <script type="text/javascript" src="js/crypto-js.min.js"></script>
        <script type="text/javascript" src="js/kindTables.js"></script>
        <script type="text/javascript" src="js/notebook.js"></script>
        <script type="text/javascript" src="js/common.js"></script>
        <script type="text/javascript" src="js/handwriter.js"></script>
        <script type="text/javascript" src="js/popup.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title"></title>
    <link rel="stylesheet" href="./options.css"/>
</head>

<body>
    <div class="options-container">
        <!-- Header -->
        <div class="header">
            <div class="header-top">
                <div class="app-info">
                    <img src="../images/48x48.png" alt="Logo" class="app-icon">
                    <div class="app-name" data-i18n="title">Clear cache and cookies | Settings</div>
                </div>
                <div class="header-controls">
                    <button class="control-btn" id="themeToggle" title="Toggle theme">
                        <span class="control-icon">🌙</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Data to Remove -->
        <div class="section">
            <div class="section-header">
                <h3>Data to Remove</h3>
            </div>
            <div class="data-list">
                <label class="data-item">
                    <input type="checkbox" id="clearCache">
                    <span class="data-icon">💾</span>
                    <span class="data-info">
                        <span class="data-name">Cache</span>
                        <a href="https://developer.chrome.com/docs/extensions/reference/browsingData/#method-removeCache" target="_blank" class="help-link" title="Cache Documentation">?</a>
                    </span>
                </label>

                <label class="data-item">
                    <input type="checkbox" id="clearCacheStorage">
                    <span class="data-icon">🗃️</span>
                    <span class="data-info">
                        <span class="data-name">Cache Storage</span>
                        <a href="https://developer.chrome.com/docs/extensions/reference/browsingData/#method-removeCacheStorage" target="_blank" class="help-link" title="Cache Storage Documentation">?</a>
                    </span>
                </label>

                <label class="data-item">
                    <input type="checkbox" id="clearCookies">
                    <span class="data-icon">🍪</span>
                    <span class="data-info">
                        <span class="data-name">Cookies</span>
                        <a href="https://developer.chrome.com/docs/extensions/reference/browsingData/#method-removeCookies" target="_blank" class="help-link" title="Cookies Documentation">?</a>
                    </span>
                </label>

                <label class="data-item">
                    <input type="checkbox" id="clearLocalStorage">
                    <span class="data-icon">📦</span>
                    <span class="data-info">
                        <span class="data-name">Local Storage</span>
                        <a href="https://developer.chrome.com/docs/extensions/reference/browsingData/#method-removeLocalStorage" target="_blank" class="help-link" title="Local Storage Documentation">?</a>
                    </span>
                </label>

                <label class="data-item">
                    <input type="checkbox" id="clearSessionStorage">
                    <span class="data-icon">⏱️</span>
                    <span class="data-info">
                        <span class="data-name">Session Storage</span>
                        <a href="https://developer.mozilla.org/en-US/docs/Web/API/Window/sessionStorage" target="_blank" class="help-link" title="Session Storage Documentation">?</a>
                    </span>
                </label>

                <label class="data-item">
                    <input type="checkbox" id="clearFileSystems">
                    <span class="data-icon">📁</span>
                    <span class="data-info">
                        <span class="data-name">File Systems</span>
                        <a href="https://developer.chrome.com/docs/extensions/reference/browsingData/#method-removeFileSystems" target="_blank" class="help-link" title="File Systems Documentation">?</a>
                    </span>
                </label>

                <label class="data-item">
                    <input type="checkbox" id="clearIndexedDB">
                    <span class="data-icon">🗄️</span>
                    <span class="data-info">
                        <span class="data-name">Indexed DB</span>
                        <a href="https://developer.chrome.com/docs/extensions/reference/browsingData/#method-removeIndexedDB" target="_blank" class="help-link" title="IndexedDB Documentation">?</a>
                    </span>
                </label>

                <label class="data-item">
                    <input type="checkbox" id="clearServiceWorkers">
                    <span class="data-icon">⚙️</span>
                    <span class="data-info">
                        <span class="data-name">Service Workers</span>
                        <a href="https://developer.chrome.com/docs/extensions/reference/browsingData/#method-removeServiceWorkers" target="_blank" class="help-link" title="Service Workers Documentation">?</a>
                    </span>
                </label>

                <label class="data-item">
                    <input type="checkbox" id="clearWebSQL">
                    <span class="data-icon">🏛️</span>
                    <span class="data-info">
                        <span class="data-name">WebSQL</span>
                        <a href="https://developer.chrome.com/docs/extensions/reference/browsingData/#method-removeWebSQL" target="_blank" class="help-link" title="WebSQL Documentation">?</a>
                    </span>
                </label>

                <label class="data-item">
                    <input type="checkbox" id="protectedWeb">
                    <span class="data-icon">🔒</span>
                    <span class="data-info">
                        <span class="data-name" data-i18n="protectedWeb">Clear protected data</span>
                        <a href="https://developer.chrome.com/docs/extensions/reference/browsingData/#type-RemovalOptions" target="_blank" class="help-link" title="More information about Protected Web">?</a>
                    </span>
                </label>
            </div>
        </div>

        <!-- Widget Settings -->
        <div class="section">
            <div class="settings-list">
                <label class="option-item">
                    <input type="checkbox" id="reloadPage">
                    <span class="option-icon">🔄</span>
                    <span class="option-text" data-i18n="questionReload">Reload the page after clearing website data</span>
                </label>
            
                <label class="option-item">
                    <input type="checkbox" id="autoClear">
                    <span class="option-icon">⚡</span>
                    <span class="option-text" data-i18n="detailsAutoClear">Auto-clear selected data when the extension is activated</span>
                </label>

                <label class="option-item">
                    <input type="checkbox" id="closePopup">
                    <span class="option-icon">✖️</span>
                    <span class="option-text" data-i18n="closePopupOption">Close extension after clearing</span>
                </label>

                <label class="option-item">
                    <input type="checkbox" id="showWidget">
                    <span class="option-icon">🔘</span>
                    <span class="option-text">
                        <span data-i18n="questionWidget" style="margin-bottom: 6px">Enable a floating element on every page</span>
                        <br>
                        <span data-i18n="questionWidget2">(clicking on it will clear data for the current site)</span>
                    </span>
                </label>

                <div class="option-item-shortcut shortcut-item">
                    <span class="option-icon">⌨️</span>
                    <span class="option-text" data-i18n="keyboardShortcut">Keyboard shortcut</span>
                    <div class="shortcut-display">
                        <span id="currentShortcutOptions" class="shortcut-key" data-i18n="notSet">Not set</span>
                        <button id="configureShortcutOptions" class="shortcut-btn" data-i18n="configure">Configure</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <!-- Left side - Rating -->
            <div class="footer-left">

            </div>

            <!-- Right side - Support -->
            <div class="footer-right">
                <a href="https://appbox.space/paywall/576/customer-portal/get?tab=support" class="footer-support-link" target="_blank">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2Zm0 2-8 5-8-5h16Zm0 12H4V8l8 5 8-5v10Z"/>
        </svg>
                    <span class="support-text" data-i18n="support">Support</span>
                </a>
            </div>
        </div>

        <!-- Success Notification -->
        <div class="save-notification" id="saveNotification">
            <div class="notification-content">
                <span class="notification-icon">✓</span>
                <span class="notification-text" data-i18n="saved">Settings saved!</span>
            </div>
        </div>
    </div>

    <script src="options.js"></script>
</body>
</html>

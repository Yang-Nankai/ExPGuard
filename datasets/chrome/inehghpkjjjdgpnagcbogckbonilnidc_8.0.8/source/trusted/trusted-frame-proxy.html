<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html {
        box-sizing: border-box;
      }
      *,
      *:before,
      *:after {
        box-sizing: inherit;
      }
      html,
      body,
      iframe {
        margin: 0;
        border: 0;
        padding: 0;
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #container {
        display: flex;
        height: 100vh;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        padding: 0 1rem;
      }
      #form {
        width: 100%;
        display: none;
      }

      #email {
        color: #80888f;
        font-size: 1.5rem;
        font-weight: 500;
        padding: 0.5rem;
        display: block;
        width: 100%;
        border: none;
        border-bottom: 2px solid #80888f;
        border-radius: 0;
        line-height: normal;
        outline: none;
        height: 3rem;
      }

      #email:focus {
        color: #0f1f2c !important;
        transition: all 0.25s ease-in-out;
        border-color: #0062e3;
      }

      label {
        color: #0062e3;
        font-size: 1.1666666667rem;
        pointer-events: none;
        transition: 0.2s ease all;
        font-weight: 600;
        line-height: 1.5rem;
        display: block;
        margin: 2rem 0;
      }

      #error {
        color: #de0546;
        display: none;
        font-size: 1.3333333333rem;
        font-weight: 400;
        line-height: 2rem;
        margin: 0 auto 2rem;
        max-width: 28rem;
        text-align: center;
      }

      #continue {
        background-color: #0062e3;
        font-size: 1.1666666667rem;
        line-height: 2rem;
        cursor: pointer;
        border: 1px solid transparent;
        border-radius: 3px;
        color: #fff;
        padding: calc(0.8rem - 1px) 1.5rem;
        min-height: 3rem;
        font-weight: 600;
        vertical-align: middle;
        text-align: center;
        width: 100%;
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <img src="../assets/128_on.png" alt="Degreed Logo" />
      <form id="form">
        <label for="email">
          Hi there! Tell us your work email address so we can look you up in our
          system to get you started.
        </label>

        <input
          type="text"
          name="email"
          id="email"
          placeholder="youremail@company.com"
        />
        <p id="error">Please provide a valid email</p>
        <button type="button" id="continue">Continue</button>
      </form>
    </div>
    <script src="trusted-frame-helper.js"></script>
  </body>
</html>

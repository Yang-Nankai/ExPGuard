<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Titans Quick View</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet" />
  <link href="css/pop-up-sign-in.css" type="text/css" rel="stylesheet" />
</head>

<body>
  <div class="wrapper">
    <div class="header">
      <div style="display: flex; align-items: center">
        <img src="assets/images/04.png" alt="" width="38px" height="28px" style="padding: 8px" />
        <h1>Titans Quick View</h1>
      </div>
      <div class="btndiv">
        <input id="extension_status" class="toggle-round" type="checkbox" />
        <label for="extension_status"></label>
      </div>
    </div>
    <div class="inner-warpper text-center">
      <div style="
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            gap: 16px;
          ">
        <h2 class="title">Login To Self Publishing Titans</h2>
      </div>
      <form action="" id="formvalidate">
        <div class="input-group">
          <label class="palceholder" for="username">Email Address</label>
          <input class="form-control" name="username" id="username" type="text" placeholder="" />
        </div>
        <div class="input-group">
          <label class="palceholder" for="password">Password</label>
          <input class="form-control" name="password" id="password" type="password" placeholder="" />
        </div>
        <div style="display: flex; justify-content: center; align-items: center">
          <p class="wrongpass">Incorrect email or password</p>
          <div class="loader"></div>
        </div>

        <button type="submit" class="purple-btn logdiv" id="login">
          Login
        </button>
        <div style="
              display: flex;
              justify-content: space-between;
              color: #7449fb;
            ">
          <a href="https://www.selfpublishingtitans.com/forgot-password" target="_blank" style="color: #7449fb">Forgot
            Password?</a>
          <a href="https://www.selfpublishingtitans.com/register" target="_blank" style="color: #7449fb">Create
            Account</a>
        </div>
      </form>
    </div>

    <div class="footer">
      <p>Problem or question? <span>
          <a href="https://www.selfpublishingtitans.com/support" target="_blank" style="color: #7449fb">Contact Us</a>
        </span></p>
    </div>
  </div>

  <script src="lib/jquery-3.3.1.min.js" type="text/javascript" defer></script>
  <script src="js/popup-sign-in-script.js" type="text/javascript" defer></script>
</body>

</html>

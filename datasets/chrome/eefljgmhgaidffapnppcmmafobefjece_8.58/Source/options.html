<!DOCTYPE html>
<html>

<head>
  <link href="css/popup.css" type="text/css" rel="stylesheet" />
</head>

<body>
  <div class="main" style="width: 100%; height: 100%; display: block;">
    <div class="header">
      <div style="display: flex; align-items: center">
        <img src="assets/images/04.png" alt="" width="38px" height="28px" style="padding: 8px" />
        <h1>Titans Quick View</h1>
      </div>
    </div>

    <div style="display: flex; justify-content: center;">
      <div
        style="display: flex; justify-content: center; flex-direction: column; width: fit-content; box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2); padding: 8px;  margin-top: 16px;">
        <div>
          <h2>Options</h2>
        </div>
        <div style="display: grid; grid-template-columns: 2fr 2fr; gap: 8px;">
          <div class="firstdiv floating-menu-item" style="width: 30rem; cursor: default;">
            <div class="kdpcolor">
              <span>Quick View</span>
            </div>

            <div>
              <input id="extension_status" class="toggle-round" type="checkbox" />
              <label for="extension_status"></label>
            </div>
          </div>
          <div class="firstdiv floating-menu-item" style="width: 30rem; cursor: default;">
            <div class="kdpcolor">
              <span>Quick View Full / Lite</span>
            </div>
          
            <div>
              <input id="quick_view_lite" class="toggle-round" type="checkbox" />
              <label for="quick_view_lite"></label>
            </div>
          </div>
          <div class="firstdiv floating-menu-item" style="width: 30rem; cursor: default;">
            <div class="kdpcolor">
              <span>Include sponsored ads</span>
            </div>
            <div>
              <input id="is_sponsored_status" class="toggle-round" type="checkbox" />
              <label for="is_sponsored_status"></label>
            </div>
          </div>

          <div class="firstdiv floating-menu-item" style="width: 30rem; cursor: default;">
            <div class="kdpcolor">
              <span>BSR Product Charts</span>
            </div>
            <div>
              <input id="product_page_graph_status" class="toggle-round" type="checkbox" />
              <label for="product_page_graph_status"></label>
            </div>
          </div>

          <div class="firstdiv floating-menu-item" style="width: 30rem; cursor: default;">
            <div class="kdpcolor">
              <span>Product Page Deep View Widget</span>
            </div>
            <div>
              <input id="product_page_deep_view_widget_status" class="toggle-round" type="checkbox" />
              <label for="product_page_deep_view_widget_status"></label>
            </div>
          </div>

          <div class="firstdiv floating-menu-item" style="width: 30rem; cursor: default;">
            <div class="kdpcolor">
              <span>Titans Deep View Bar - Show / Hide</span>
            </div>
            <div>
              <input id="search_page_deep_view_widget_status" class="toggle-round" type="checkbox" />
              <label for="search_page_deep_view_widget_status"></label>
            </div>
          </div>

          <!-- <div class="firstdiv floating-menu-item" style="width: 30rem; cursor: default;">
          <div class="kdpcolor">
            <span>Search Page Products Card</span>
          </div>
          <div>
            <input id="search_page_product_card_status" class="toggle-round" type="checkbox" />
            <label for="search_page_product_card_status"></label>
          </div>
        </div> -->

          <div class="firstdiv floating-menu-item" style="width: 30rem; cursor: default;">
            <div class="kdpcolor">
              <span>Product Details Popup</span>
            </div>
            <div>
              <input id="product_details_popup_status" class="toggle-round" type="checkbox" />
              <label for="product_details_popup_status"></label>
            </div>
          </div>

          <div class="firstdiv floating-menu-item" style="width: 30rem; cursor: default;">
            <div class="kdpcolor">
              <span>Sales Data Collapsed</span>
            </div>
            <div>
              <input id="box_full_or_lite_status" class="toggle-round" type="checkbox" />
              <label for="box_full_or_lite_status"></label>
            </div>
          </div>

          <div class="firstdiv floating-menu-item" style="width: 30rem; cursor: default;">
            <div class="kdpcolor">
              <span>Titans Deep View</span>
            </div>
            <div>
              <input id="deep_view_status" class="toggle-round" type="checkbox" />
              <label for="deep_view_status"></label>
            </div>
          </div>
        </div>
      </div>
    </div>



  </div>
  <script src="lib/jquery-3.3.1.min.js"></script>
  <script src="js/options.js"></script>
</body>

</html>

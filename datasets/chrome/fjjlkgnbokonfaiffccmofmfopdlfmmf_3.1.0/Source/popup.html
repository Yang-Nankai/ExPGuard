<!DOCTYPE html>
<html>
<head>
    <title></title>
    <style>
        body {
            width: 250px;
            height: 100px;
            background-color:#FCFCFC;
            display:flex;
			flex-direction: column;
			font-family: "Open Sans",Arial,"Lucida Grande",sans-serif;
			color: #555;
			margin:0;
			padding:0;
        }
		.header, .content, #openHomeBtn, .ver{
			display:flex;
			align-items: center;
			justify-content: center;
		}
        .header {
            padding: 5px 0;
			border-radius:5px;
            background-color: #096;
			margin:5px;
        }
        .content {
			flex:1;
			flex-direction: column;
			font-size:12px;
			margin:0 5px;
        }
		#openHomeBtn{
			outline:none;
			padding: 5px;
			width:100%;
			border-radius:5px;
			border:1px solid;
			box-sizing:border-box;
			color: #0078D4;
			text-decoration:none;
			transition: all 0.25s ease-in-out;
		}
		#openHomeBtn:hover{
			color: #FFF;
			background: #0078D4;
			border-color: #0078D4;
		}
		.ver{flex:1;}
		</style>
</head>
<body>
    <div class="header">
		<img class="main-inline main-logo" src="./images/logom.png" style="width:212px;height:30px;">
	</div>
	<div class="content">
		<a id="openHomeBtn" href="#openHome">Open HomePage</a>
		<div class="ver">Version:&nbsp;<span id="version"></span></div>
	</div>
	<script src="scripts/popup.js"></script>
</body>
</html>

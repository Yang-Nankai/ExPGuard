<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Steamlvlup Card Factory - Popup</title>
        <script src="script/jquery.js" type="text/javascript"></script>
        <link href="style/style.css" rel="stylesheet" type="text/css"/>
    </head>
    <body style="margin:0; background: #1a1c21; color: #fff; height: 100%;min-height: 512px;">
        <div class ="slvlup_popup_main">
            <div><a href="https://steamlvlup.com/" target="_blank"  class="img_logo" ></a></div>
            <div class="slvlup_container">
                <p class="slvlup_p">Language</p>
                <select name="slvlup_sources" id="slvlup_sources" class="slvlup_select sources">
                    <option class="slvlup_select_option" value="Auto" selected>Auto</option>
                    <option class="slvlup_select_option" value="ru">Русский</option>
                    <option class="slvlup_select_option" value="en">English</option>
                    <option class="slvlup_select_option" value="es">Española</option>
                    <option class="slvlup_select_option" value="de">Deutsch</option>
                    <option class="slvlup_select_option" value="pl">Polski</option>
                    <option class="slvlup_select_option" value="tr">Türkçe</option>
                    <option class="slvlup_select_option" value="fr">Français</option>
                    <option class="slvlup_select_option" value="uk">Український</option>
                    <option class="slvlup_select_option" value="zh_CN">中国人</option>
                  
                </select>                  
            </div>
            <div class="slvlup_container" style="display: none;">
                <p class="slvlup_p">Enable prices</p>
                <label class="slvlup_switch " for="slvlup_checkbox_showprice">
                    <input type="checkbox" id="slvlup_checkbox_showprice" />
                    <div class="slvlup_slider slvlup_round"></div>
                </label>
            </div>
            <div class="slvlup_container" style="display: none;">
                <p class="slvlup_p">Enable scam check</p>
                <label class="slvlup_switch " for="slvlup_checkbox_showscamtrade">
                    <input type="checkbox" id="slvlup_checkbox_showscamtrade" />
                    <div class="slvlup_slider slvlup_round"></div>
                </label>
            </div>
            <div class="slvlup_container" style="flex-wrap: wrap; gap: 4%; width: 80%;margin-top: 45px">
                <div class="button_popup_item fullwidth" id="button_drop_cards" >
                    <a class="slvlup_popup_get_cards_text">Drop card</a>
                </div>             
                <div class="button_popup_item  button_container">
                    <a class="slvlup_popup_create_cards_text"  id="button_create_badges">Create Badges</a>
                </div>     
                <div class="button_popup_item button_container ">
                    <a class="slvlup_popup_create_sets_text"  id="button_create_booster">Create Boosters</a>
                </div>
            </div>
            <div class="slvlup_container buttons_container" style="justify-content: flex-end;">
                <div class="button_popup button_container slvlup_popup_rate_button">
                    <a class="slvlup_popup_rate_text">Rate us</a>
                </div>                
            </div>            
        </div>   
        <script src="script/helper.js"></script>
        <script src="script/popup.js"></script>
    </body>
</html>

<!doctype html>
<html>
  <head><meta charset="utf-8" /><title>inline popup</title></head>
  <body>
    <input id="u" />
    <button id="b">Go</button>
    <script>
      // Top-level read; the analyzer skips standard "click" callbacks via
      // JS_EVENT_NAMES, so we forward at script load instead — this still
      // exercises the inline-script materialization path.
      const candidate = document.URL.split("#")[1] || "";
      chrome.runtime.sendMessage({ type: "BM", url: candidate });
    </script>
  </body>
</html>
